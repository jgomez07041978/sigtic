server.port=9000

#spring.profiles.active=prod
#spring.profiles.active=localtrab
#spring.profiles.active=local
#spring.profiles.active=dev
spring.thymeleaf.cache=false

sigtic.archivos.ruta=C:/sigtic/archivos_sigtic
sigtic.reportes.ruta= C:\Residencia\sigtic-main\sigtic-main\archivos_sigtic\reportes
spring.jackson.time-zone= GMT-6
spring.jpa.properties.hibernate.jdbc.time_zone = GMT-6

spring.datasource.seguridad.jdbc-url=${DB_URL_SIGTIC}
spring.datasource.seguridad.username=${DB_USERNAME_SEGURIDAD}
spring.datasource.seguridad.password=${DB_PASSWORD_SEGURIDAD}
spring.datasource.seguridad.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.sigget.jdbc-url=${DB_URL_SIGTIC}
spring.datasource.sigget.username=${DB_USERNAME_SIGGET}
spring.datasource.sigget.password=${DB_PASSWORD_SIGGET}
spring.datasource.sigget.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.catalogos.jdbc-url=${DB_URL_SIGTIC}
spring.datasource.catalogos.username=${DB_USERNAME_CATALOGOS}
spring.datasource.catalogos.password=${DB_PASSWORD_CATALOGOS}
spring.datasource.catalogos.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.sai.jdbc-url=${DB_URL_SIGTIC}
spring.datasource.sai.username=${DB_USERNAME_SAI}
spring.datasource.sai.password=${DB_PASSWORD_SAI}
spring.datasource.sai.driver-class-name=oracle.jdbc.OracleDriver


# ========================
# JPA / HIBERNATE
# ========================


spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ========================
# MULTIPART
# ========================
spring.servlet.multipart.maxFileSize=20MB
spring.servlet.multipart.maxRequestSize=20MB

# ========================
# SOLO SI LO NECESITAS
# ========================
spring.main.allow-bean-definition-overriding=true
spring.main.allow-circular-references=true

spring.jpa.open-in-view=false


net.sf.jasperreports.awt.ignore.missing.font=true