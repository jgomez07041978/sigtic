server.port=9000

#spring.profiles.active=prod
spring.profiles.active=localtrab
#spring.profiles.active=local
#spring.profiles.active=dev
spring.thymeleaf.cache=false

sigtic.archivos.ruta=C:/sigtic/archivos_sigtic
sigtic.reportes.ruta= C:\Residencia\sigtic-main\sigtic-main\archivos_sigtic\reportes
spring.jackson.time-zone= GMT-6
spring.jpa.properties.hibernate.jdbc.time_zone = GMT-6

# ========================
# JPA / HIBERNATE
# ========================
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.Oracle10gDialect

spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ========================
# MULTIPART
# ========================
spring.servlet.multipart.maxFileSize=20MB
spring.servlet.multipart.maxRequestSize=20MB

# ========================
# SOLO SI LO NECESITAS
# ========================
spring.main.allow-bean-definition-overriding=true
spring.main.allow-circular-references=true

spring.jpa.open-in-view=false


net.sf.jasperreports.awt.ignore.missing.font=true