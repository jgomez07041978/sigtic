server.servlet.contextPath=/sigtic
#management.endpoints.web.base-path=/actuator
#Ambiente de Desarrollo
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.properties.hibernate.format_sql=false

spring.datasource.seguridad.maximum-pool-size=5
spring.datasource.seguridad.minimum-idle=1
spring.datasource.seguridad.connection-timeout=30000
spring.datasource.seguridad.idle-timeout=600000
spring.datasource.seguridad.max-lifetime=1800000

spring.datasource.sigget.maximum-pool-size=5
spring.datasource.sigget.minimum-idle=1
spring.datasource.sigget.connection-timeout=30000
spring.datasource.sigget.idle-timeout=600000
spring.datasource.sigget.max-lifetime=1800000

spring.datasource.catalogos.maximum-pool-size=5
spring.datasource.catalogos.minimum-idle=1
spring.datasource.catalogos.connection-timeout=30000
spring.datasource.catalogos.idle-timeout=600000
spring.datasource.catalogos.max-lifetime=1800000

spring.datasource.sai.maximum-pool-size=10
spring.datasource.sai.minimum-idle=2
spring.datasource.sai.connection-timeout=30000
spring.datasource.sai.idle-timeout=600000
spring.datasource.sai.max-lifetime=1800000


#Local casa por vpn
