<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="layout/mainLayout :: title" />

    <th:block th:replace="layout/mainLayout :: link" />
    <link th:href="@{/include/vakata-jstree-8c1bcc8/dist/themes/default/style.css}" rel="stylesheet">
    <link th:href="@{/include/css_personalizado/general.css}" rel="stylesheet">
</head>
<body>
<div th:replace="layout/mainLayout :: header"></div>

<div th:replace="layout/mainLayout :: sidebar"></div>

<main id="main" class="main">
    <div class="pagetitle">
        <h1 th:text="${titlePage}"></h1>
        <section class="section">
            <div class="row">
                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex align-items-center highlight-toolbar ps-3 pe-2 py-1 border-0 border-top border-bottom">
                                <!--<small class="card-title">Grupos</small>-->
                                <div class="d-flex ms-auto">
                                    <button type="button" id="idNuevoConfig" th:if="${activeAgregar}" class="btn btn-primary btn-lg"><i class="bi bi-plus-circle-dotted"></i> Nuevo</button>
                                    <!--<a target="_blank" th:href="@{'/api/catalogo/tic/reporte/42'}">Reporte</a>-->
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-lg-12">
                                    <div class="card pt-2">
                                        <div class="card-body">
                                            <table id="tableLogos" th:if="${activeConsultar}" class="table table-striped table-hover table-sm"  style="width:100%">
                                                <thead>
                                                <tr>
                                                    <th>Reporte</th>
                                                    <th>Título Reporte</th>
                                                    <th>Tipo Servicio</th>
                                                    <th>SubTipo Servicio</th>
                                                    <th>Estatus</th>
                                                    <th>Acción</th>
                                                </tr>
                                                </thead>
                                                <tbody>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <th:block th:replace="configuracion/reporteModal :: modal" />
    <th:block th:replace="servicio-tic/servicioModal.html :: modalSearchUsuario" />

</main>

<th:block th:replace="layout/mainLayout :: footer" />
<th:block th:replace="layout/mainLayout :: script" />

<script type="text/javascript" th:src="@{/js/configuracion/reporte.js}"></script>

</body>
</html>
