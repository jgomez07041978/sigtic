<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="layout/mainLayout :: title" />
    <th:block th:replace="layout/mainLayout :: link" />
    <link th:href="@{/include/css_personalizado/general.css}" rel="stylesheet">
</head>
<body>

<div th:replace="layout/mainLayout :: header"></div>
<div th:replace="layout/mainLayout :: sidebar"></div>

<main id="main" class="main">
    <div class="pagetitle">
        <h1 th:text="${titlePage}"></h1>

        <section class="section">
            <div class="row">
                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex align-items-center highlight-toolbar ps-3 pe-2 py-1 border-0 border-top border-bottom">
                                <small class="card-title">Listado Tipos de Correo</small>
                                <div class="d-flex ms-auto gap-1">

                                    <!-- Botón Exportar -->
                                    <a th:href="@{/api/catalogo/tic/exportarTipoCorreo}" th:if="${activeConsultar}" class="btn btn-success btn-sm"><i class="bi bi-file-earmark-excel"></i> Exportar
                                    </a>

                                    <!-- Botón Nuevo -->
                                    <button type="button"
                                            id="idNuevoTipoCorreo"
                                            th:if="${activeAgregar}"
                                            class="btn btn-primary btn-sm">
                                        <i class="bi bi-plus-circle-dotted"></i> Nuevo
                                    </button>

                                </div>
                            </div>

                            <!-- Tabla -->
                            <div class="row" id="idCardTablaAdmin">
                                <div class="col-lg-12">
                                    <div class="card">
                                        <div class="card-body"><br/>
                                            <table id="tablaTipoCorreo"
                                                   th:if="${activeConsultar}"
                                                   class="table table-striped table-hover">

<!--                                                   style="width:100%">-->
                                                <thead>
                                                <tr>
                                                    <th>Cve Tipo de Correo</th>
                                                    <th>Descripción Tipo Correo</th>
                                                    <th>Número de Orden</th>
                                                    <th>Estatus</th>
                                                    <th>Acción</th>
                                                </tr>
                                                </thead>
                                                <tbody></tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>


    <th:block th:replace="catalogo_tic/tipoCorreoModal.html :: tipoCorreoModal" />

</main>

<th:block th:replace="layout/mainLayout :: footer" />
<th:block th:replace="layout/mainLayout :: script" />

<script type="text/javascript" th:src="@{/js/catalogo_tic/tipo-correo.js}"></script>

</body>
</html>
