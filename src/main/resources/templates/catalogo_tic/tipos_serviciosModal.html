<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<th:block th:fragment="modalTipoServicio">

    <div class="modal fade" id="dlgModalFormTipoServicioForm" aria-labelledby="dlgModalFormTipoServicioLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><span id="titleFormTipoServicio" class="fw-bold"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>

                <div class="modal-body body-modal">
                    <form id="idFormTipoServicio" method="post">
                        <input type="hidden" id="idTipoServicioTic" name="idTipoServicioTic">

                                <div class="d-grid gap-2">
                                    <div class="row g-2">
                                        <div class="col-sm-12 col-md-4 col-xl-4 col-xxl-4">
                                            <div class="form-floating mb-3">
                                                <input type="text" class="form-control" id="tipoServicioAbrev" name="tipoServicioAbrev">
                                                <label for="tipoServicioAbrev"><span class="text-danger fw-bold">*</span> Tipo de Servicio Abreviado</label>
                                            </div>
                                        </div>
                                        <div class="col-sm-12 col-md-8 col-xl-8 col-xxl-8">
                                            <div class="form-floating mb-3">
                                                <input type="text" class="form-control" id="tipoServicio" name="tipoServicio">
                                                <label for="tipoServicio"><span class="text-danger fw-bold">*</span> Tipo de Servicio</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row g-2">
                                        <div class="col-sm-12 col-md-4 col-xl-4 col-xxl-4">
                                            <div class="form-floating mb-3">
                                                <input type="number" class="form-control" id="ordenTipoServicio" name="ordenTipoServicio" placeholder="Número de Orden">
                                                <label for="ordenTipoServicio"><span class="text-danger fw-bold">*</span> Número de Orden</label>
                                            </div>
                                        </div>
                                        <div class="col-sm-12 col-md-4 col-xl-4 col-xxl-4">
                                            <div class="form-floating mb-3">
                                                <select class="form-select" id="cveEstatus" name="cveEstatus">
                                                    <option value="VIG" selected>Vigente</option>
                                                    <option value="HIS">Historico</option>
                                                </select>
                                                <label for="cveEstatus"><span class="text-danger fw-bold">*</span> Estatus</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                        <div class="text-center">
                            <button type="submit"  class="btn btn-primary btn-lg"><i class="fa-regular fa-floppy-disk"></i> Guardar</button>
                            <button type="button"  class="btn btn-danger btn-lg" onclick="limpiarFormulario()"><i class="fa fa-eraser"></i> Limpiar</button>
                        </div>
                        <div class="float-end"><span class="text-danger fw-bold">*</span> <span class="fw-bold">Campos requeridos</span></div>
                    </form>
                </div>
                <div class="modal-footer my-0">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cerrar</button>
                    <br/>
                </div>



            </div>
        </div>
    </div>

</th:block>

</body>
</html>
