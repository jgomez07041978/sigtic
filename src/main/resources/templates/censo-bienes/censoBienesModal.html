<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

 <th:block th:fragment="modalListaCargaEnte">

    <div class="modal fade" id="dlgModalcargaEnte" aria-labelledby="dlgModalcargaEnteLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Listado de Bienes a Cargar</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>
                <div class="modal-body body-modal">

                    <table id="tableCargaBienesEnte" class="table table-striped table-hover table-sm"  style="width:100%">
                        <thead>
                        <tr>
                            <th>Ente Público</th>
                            <th>Fecha de Corte</th>
                            <th>RFC Carga</th>
                            <th>Nombre Usuario Carga</th>
                            <th>Estatus</th>
                            <th>Total</th>
                        </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>

                </div>
                <div class="modal-footer my-0">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cerrar</button>
                    <br/>
                </div>
            </div>
        </div>
    </div>

     <div class="modal fade" id="dlgModalListaBienesUnidad" aria-labelledby="dlgModalListaBienesUnidadLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
         <div class="modal-dialog modal-xl modal-dialog-scrollable">
             <div class="modal-content">
                 <div class="modal-header">
                     <h5 class="modal-title">Bienes de : <span id="unidadText"></span></h5>
                     <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                     </button>
                 </div>
                 <div class="modal-body body-modal">

                     <table id="tableBienesUnidad" class="table table-striped table-hover table-sm"  style="width:100%">
                         <thead>
                         <tr>
                             <th>Número Inventario</th>
                             <th>Descripción</th>
                             <th>Fecha Alta</th>
                             <th>Costo</th>
                             <th>Nota</th>
                             <th>Fecha Corte</th>
                         </tr>
                         </thead>
                         <tbody>
                         </tbody>
                     </table>

                 </div>
                 <div class="modal-footer my-0">
                     <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cerrar</button>
                     <br/>
                 </div>
             </div>
         </div>
     </div>


 </th:block>
</body>
</html>
