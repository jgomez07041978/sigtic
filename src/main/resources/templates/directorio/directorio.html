<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SIGTIC</title>
    <link rel="icon" th:href="@{/include/imagen/icono.ico}" type="image/x-icon"/>
<!--    <link th:href="@{/include/bootstrap-5.3.1-dist/css/bootstrap.min.css}" rel="stylesheet" />
    <link th:href="@{/include/select2-bootstrap-5-theme-1.3.0/dist/select2.min.css}" rel="stylesheet">
    <link th:href="@{/include/select2-bootstrap-5-theme-1.3.0/dist/select2-bootstrap-5-theme.css}" rel="stylesheet">
    <link th:href="@{/include/fontawesome-free/css/all.min.css}" rel="stylesheet" />
    <link th:href="@{/include/vakata-jstree-8c1bcc8/dist/themes/default/style.css}" rel="stylesheet">
    <link th:href="@{/assets/css/style.css}" rel="stylesheet">-->

    <th:block th:replace="layout/mainLayout :: link" />
    <link th:href="@{/include/vakata-jstree-8c1bcc8/dist/themes/default/style.css}" rel="stylesheet">
</head>
<body>
<input type="hidden" id="contextSigtic" name="contextSigtic" th:value="${contextSigtic}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
<header id="header" class="header fixed-top d-flex align-items-center">

    <div class="d-flex align-items-center justify-content-between">
        <a href="#" class="logo d-flex align-items-center">
            <img th:src="@{/include/imagen/logo_gob.png}" class="image img-fluid">
            <!--<img src="assets/img/infra.png" alt="">-->
            <span class="d-none d-lg-block">SIGTIC</span>
        </a>

    </div><!-- End Logo -->

    <div class="search-bar fw-bold">
        Sistema Integral de Gestión de Tecnología de la Información y Comunicación
    </div>
    <!-- End Search Bar -->
</header>
<main id="main2" class="main">

        <div class="pagetitle">
            <br>
            <section class="section">
                <div class="container">
                    <div class="card">
                        <div class="card-header">
                            <h1 class="text-center" th:text="${titlePage}"></h1>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-12">
                                    <div class="form-floating py-3">
                                        <select class="form-select form-select-lg" id="idEntePublicoSearch" name="idEntePublicoSearch">
                                        </select>
                                        <label for="idEntePublicoSearch">Ente Público</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-12">
                                    <div class="input-group mb-3">
                                        <div class="form-floating">
                                            <input type="hidden" id="idUnidadAdmtva" name="idUnidadAdmtva">
                                            <input type="text" class="form-control bg-secondary-subtle"  id="descUnidadAdmtva" name="descUnidadAdmtva" placeholder="Unidad Administrativa">
                                            <label for="descUnidadAdmtva">Unidad Administrativa</label>
                                        </div>
                                        <button class="btn btn-primary" type="button" id="btnOpenArbol"><i class="fa-solid fa-folder-tree"></i></button>
                                    </div>
                                </div>
                            </div>
                            <div class="row g-2">
                                <div class="col-xs-12 col-sm-12 col-md-6 col-lg-6 col-xl-6 col-xxl-6">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control"  id="nombre" name="nombre" placeholder="Nombre">
                                        <label for="nombre"> Nombre</label>
                                    </div>
                                </div>

                                <div class="col-xs-6 col-sm-6 col-md-4 col-lg-3 col-xl-3 col-xxl-3">
                                    <div class="form-floating mb-3">
                                        <input type="email" class="form-control"  id="telefono" name="telefono" placeholder="Teléfono">
                                        <label for="telefono"> Teléfono Institucional</label>
                                    </div>
                                </div>
                                <div class="col-xs-6 col-sm-6 col-md-2 col-lg-3 col-xl-3 col-xxl-3">
                                    <div class="form-floating mb-3">
                                        <input type="email" class="form-control"  id="extension" name="extension" placeholder="Extensión">
                                        <label for="extension"> Extensión</label>
                                    </div>
                                </div>
                            </div>

                        </div>
                        <div class="card-footer text-body-secondary text-center">
                            <button type="button"  class="btn btn-dark btn-lg" onclick="limpiarBusqueda()"><i class="fa-solid fa-eraser"></i> Limpiar</button>
                            <button type="button"  class="btn btn-primary btn-lg" onclick="buscar()"><i class="fa-solid fa-filter"></i> Buscar</button>
                        </div>
                    </div>
                   <div class="alert alert-warning" role="alert" style="display: none" id="alertSearch">
                        <span id="idMsgAlertSearch" class="fw-bold"></span>
                    </div>

                </div>
                <div class="container-fluid" id="idContainerSearch" style="display: none">
                    <div class="card">
                        <div class="card-body">
                            <br/>
                            <nav style="display: none" id="paginationNav">
                                <ul class="pagination pagination-lg justify-content-center">
                                    <li class="page-item" id="primeraPag">
                                        <a class="page-link" onclick="primeraPagina()">Primera</a>
                                    </li>
                                    <li class="page-item" id="previousPag">
                                        <a class="page-link" onclick="anteriorPagina()">Anterior</a>
                                    </li>
                                    <li class="page-item">
                                        <div class="form-floating mb-3">
                                            <input type="number" class="form-control text-center fw-bold" id="actualPage" placeholder="">
                                            <label for="actualPage">Página Actual</label>
                                        </div>

                                    </li>
                                    <li class="page-item">
                                        <a class="page-link fw-bold text-center"><span id="infoPag"></span></a>
                                    </li>
                                    <li class="page-item" id="nextPag">
                                        <a class="page-link" href="#" onclick="siguientePagina()" >Siguiente</a>
                                    </li>
                                    <li class="page-item" id="lastPag">
                                        <a class="page-link" onclick="ultimaPagina()">Última</a>
                                    </li>
                                </ul>
                                <div class="text-center fw-bold">
                                    <span id="totalRegistro"></span>
                                </div>
                            </nav>
                            <table id="tableDirectorio" class="table table-striped table-hover"  style="width:100%; display: none">
                                <thead>
                                <tr>
                                    <th>Ente Público</th>
                                    <th>Nombre Completo</th>
                                    <th>Teléfono Institucional</th>
                                    <th>Extensión</th>
                                    <th>Correo Institucional</th>
                                    <th>Unidad Administrativa</th>
                                    <th>Ruta Unidad Administrativa</th>
                                </tr>
                                </thead>
                                <tbody>
                                </tbody>
                            </table>

                        </div>
                    </div>
                </div>
            </section>

        </div>

    <th:block th:replace="layout/modalUnidadLayout :: modalUnidad5" />
</main>

<div class="modal fade" id="idModalLoading" aria-labelledby="idModalLoadingLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
    <div class="modal-dialog  modal-dialog-centered">
        <div class="modal-content bg-dark opacity-50 text-center">
            <div class="modal-body">
                <div class="spinner-border text-primary fw-bold" style="width: 3rem; height: 3rem;" role="status">
                    <span class="visually-hidden">Cargando...</span>
                </div>
            </div>
            <div class="text-primary fw-bold text-center" role="status">
                <span>SIGTIC Procesando...</span>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" th:src="@{/include/vakata-jstree-8c1bcc8/dist/jstree.min.js}"></script>
<script type="text/javascript" th:src="@{/js/directorio/directorio.js}"></script>
<script type="text/javascript" th:src="@{/js/tree/tree-unidadades-admin-5.js}"></script>
</body>
</html>
