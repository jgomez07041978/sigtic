<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="layout/mainLayout :: title" />
    <th:block th:replace="layout/mainLayout :: link" />
    <link th:href="@{/include/vakata-jstree-8c1bcc8/dist/themes/default/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="layout/mainLayout :: header"></div>

<div th:replace="layout/mainLayout :: sidebar"></div>

<main id="main" class="main">
    <input type="hidden" id="idEntePublicoAsignado" value="">
    <input type="hidden" id="descEntePublicoAsignado" value="">
    <div class="pagetitle">
        <h1 th:text="${titlePage}"></h1>
        <input type="hidden" name="idEntePublicoSession" id="idEntePublicoSession" th:value="${idEntePublicoSession}">
        <section class="section py-2">
            <div class="row">
                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex align-items-center highlight-toolbar ps-3 pe-2 py-1 border-0 border-top border-bottom">
                                <small class="card-title">Listado de domicilios</small>
                                <div class="d-flex ms-auto gap-1">
                                    <button type="button" id="btnExportarDomicilios" th:if="${activeConsultar}" class="btn btn-success" disabled onclick="exportarDomiciliosPorEnte()"><i class="fa-solid fa-file-excel"></i> Exportar Domicilios</button>
                                    <button type="button" th:if="${activeConsultar}" class="btn btn-success" onclick="exportarTodosDomicilios()"><i class="fa-solid fa-file-excel"></i> Exportar Todos los Domicilios</button>
                                    <button type="button" id="btnExportarUbicacionesEnte" th:if="${activeConsultar}" class="btn btn-success" disabled onclick="exportarUbicacionesPorEnte()"><i class="fa-solid fa-file-excel"></i> Exportar Ubicaciones</button>
                                    <button type="button" th:if="${activeConsultar}" class="btn btn-outline-success" onclick="exportarTodasUbicaciones()"><i class="fa-solid fa-file-excel"></i> Exportar Todas las Ubicaciones</button>
                                    <button type="button" id="idNuevoDomicilio" th:if="${activeAgregar}" class="btn btn-primary"><i class="fas fa-plus-circle"></i> Nuevo Domicilio</button>
                                </div>
                            </div>

                            <div class="form-floating py-3" th:if="${activeConsultar}">
                                <select class="form-select form-select-lg" id="idEntePublicoSearch" name="idEntePublicoSearch">
                                </select>
                                <label for="idEntePublicoSearch">Ente Público</label>
                            </div>
                            <table id="tableDomicilios" class="table table-striped table-hover table-sm"  style="width:100%">
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Domicilio</th>
                                    <th>Ubicaciones</th>
                                    <th>Estatus</th>
                                    <th>Acción</th>
                                </tr>
                                </thead>
                                <tbody>
                                </tbody>
                            </table>

                        </div>
                    </div>
                </div>
            </div>
        </section>

    </div>

</main>

<th:block th:replace="catalogo/domicilioModal :: modalFormDomicilio" />
<th:block th:replace="catalogo/domicilioModal :: modalUbicaciones" />
<th:block th:replace="catalogo/ubicacionModal :: modalFormUbicacion" />
<th:block th:replace="layout/modalUnidadLayout :: modalUnidad" />


<th:block th:replace="layout/mainLayout :: footer" />

<th:block th:replace="layout/mainLayout :: script" />
<script type="text/javascript" th:src="@{/include/vakata-jstree-8c1bcc8/dist/jstree.min.js}"></script>
<script type="text/javascript" th:src="@{/js/catalogo/domicilio.js}"></script>
<script type="text/javascript" th:src="@{/js/tree/tree-unidadades-admin-1.js}"></script>
<script th:inline="javascript">
$(document).ready(function() {
    setTimeout(function() {
        if ($('#idEntePublicoSearch').val() !== '' && $('#idEntePublicoSearch').val() !== null) {
            $('#btnExportarDomicilios').prop('disabled', false);
            $('#btnExportarUbicacionesEnte').prop('disabled', false);
        }
    }, 500);
    $('#idEntePublicoSearch').on('change', function() {
        const tiene = $(this).val() !== '' && $(this).val() !== null;
        $('#btnExportarDomicilios').prop('disabled', !tiene);
        $('#btnExportarUbicacionesEnte').prop('disabled', !tiene);
    });
});

function descargarExcel(url, filename) {
    onLoading(null);
    fetch(url, { headers: { 'X-CSRF-Token': $('input[name="_csrf"]').val() } })
        .then(res => {
            if (!res.ok) throw new Error('Error al exportar');
            return res.blob();
        })
        .then(blob => {
            const a = document.createElement('a');
            a.href = window.URL.createObjectURL(blob);
            a.download = filename;
            a.click();
            window.URL.revokeObjectURL(a.href);
            offLoading(null);
        })
        .catch(() => {
            offLoading(null);
            Toast.fire({ icon: 'error', title: 'Error al exportar' });
        });
}

function exportarDomiciliosPorEnte() {
    const ctx = /*[[${contextSigtic}]]*/ '';
    const id  = parseInt($('#idEntePublicoSearch').val()) || parseInt($('#idEntePublicoSession').val()) || 0;
    descargarExcel(ctx + '/api/catalogo/domicilioentePublico/exportarDomiciliosPorEnte/' + id,
                   'domicilios_ente_' + id + '.xlsx');
}

function exportarUbicacionesPorEnte() {
    const ctx = /*[[${contextSigtic}]]*/ '';
    const id  = parseInt($('#idEntePublicoSearch').val()) || parseInt($('#idEntePublicoSession').val()) || 0;
    descargarExcel(ctx + '/api/catalogo/domicilioentePublico/exportarUbicacionesPorEnte/' + id,
                   'ubicaciones_ente_' + id + '.xlsx');
}

function exportarTodosDomicilios() {
    const ctx = /*[[${contextSigtic}]]*/ '';
    descargarExcel(ctx + '/api/catalogo/domicilioentePublico/exportarTodosDomicilios', 'todos_domicilios.xlsx');
}

function exportarTodasUbicaciones() {
    const ctx = /*[[${contextSigtic}]]*/ '';
    descargarExcel(ctx + '/api/catalogo/domicilioentePublico/exportarTodasUbicaciones',
                   'ubicaciones_todas.xlsx');
}
</script>
</body>
</html>
