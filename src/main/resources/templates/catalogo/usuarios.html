<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="layout/mainLayout :: title" />

    <th:block th:replace="layout/mainLayout :: link" />
    <link th:href="@{/include/vakata-jstree-8c1bcc8/dist/themes/default/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="layout/mainLayout :: header"></div>

<div th:replace="layout/mainLayout :: sidebar"></div>

<main id="main" class="main">
    <div class="pagetitle">
        <h1 th:text="${titlePage}"></h1>
        <input type="hidden" name="idEntePublicoSession" id="idEntePublicoSession" th:value="${idEntePublicoSession}">
        <section class="section">
                    <form id="formBusquedaUsuario">
                        <div class="card">
                            <div class="card-body">
                                <br/>
                                <div class="row g-2">

                                    <div class="col-3">
                                        <div class="form-floating mb-3">
                                            <input type="text" class="form-control"  id="curpSearch" name="curpSearch" placeholder="CURP">
                                            <label for="curpSearch"> CURP</label>
                                        </div>
                                    </div>

                                    <div class="col-3">
                                        <div class="form-floating mb-3">
                                            <input type="text" class="form-control"  id="rfcSearch" name="rfcSearch" placeholder="RFC">
                                            <label for="rfcSearch"> RFC</label>
                                        </div>
                                    </div>

                                    <div class="col-6 mt-2"><br>
                                        <div class="form-check form-check-inline">
                                            <input type="checkbox" class="form-check-input" id="idVigente" name="idVigente" checked>
                                            <label class="form-check-label" for="idVigente">Vigente</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input type="checkbox" class="form-check-input" id="idHistorico" name="idHistorico" checked>
                                            <label class="form-check-label" for="idHistorico">Historico</label>
                                        </div>
                                        <!-- <div class="form-check form-check-inline">
                                             <input type="checkbox" class="form-check-input" id="idNoVigente" name="idNoVigente">
                                             <label class="form-check-label" for="idNoVigente">No Vigente</label>
                                         </div>-->
                                    </div>
                                </div>
                                <div class="row g-2">
                                    <div class="col-3">
                                        <div class="form-floating mb-3">
                                            <input type="text" class="form-control"  id="nombreSearch" name="nombreSearch" placeholder="Nombre">
                                            <label for="nombreSearch"> Nombre</label>
                                        </div>
                                    </div>
                                    <div class="col-3">
                                        <div class="form-floating mb-3">
                                            <input type="text" class="form-control"  id="segundoNombreSearch" name="segundoNombreSearch" placeholder="Segundo Nombre">
                                            <label for="segundoNombreSearch"> Segundo Nombre</label>
                                        </div>
                                    </div>

                                    <div class="col-3">
                                        <div class="form-floating mb-3">
                                            <input type="text" class="form-control"  id="apellidoPaternoSearch" name="apellidoPaternoSearch" placeholder="Apellido Paterno">
                                            <label for="apellidoPaternoSearch"> Apellido Paterno</label>
                                        </div>
                                    </div>
                                    <div class="col-3">
                                        <div class="form-floating mb-3">
                                            <input type="text" class="form-control"  id="apellidoMaternoSearch" name="apellidoMaternoSearch" placeholder="Apellido Materno">
                                            <label for="apellidoMaternoSearch"> Apellido Materno</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="card-footer">
                                <button type="submit" id="idBtnSearch" class="btn btn-primary btn-sm"><i class="fas fa-search"></i> Buscar</button>
                                <button type="button" id="idBtnSearchTodo" class="btn btn-primary btn-sm"><i class="fas fa-search"></i> Buscar Todo</button>
                                <button type="button" id="idNuevoUsuario" th:if="${activeAgregar}" class="btn btn-secondary  btn-sm"><i class="bi bi-person-plus"></i> Nuevo Usuario</button>
                                <button type="button" id="idBtnLimpiar" class="btn btn-warning btn-sm"><i class="fas fa-eraser"></i> Limpiar</button>
                                <a id="btnExportar" href="javascript:void(0)" class="btn btn-success btn-sm"><i class="bi bi-file-earmark-excel"></i> Exportar Busqueda
                                </a>
                            </div>
                        </div>
                    </form>


            <div class="row" style="display: none" id="idCardTablaUsuario">
                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex align-items-center highlight-toolbar ps-3 pe-2 py- border-0 border-bottom">
                                <small class="card-title">Listado de Usuarios</small>
                                <div class="d-flex ms-auto">

                                </div>
                            </div>
                            <table id="tableUsuario" th:if="${activeConsultar}" class="table table-striped table-hover table-sm"  style="width:100%">
                                <thead>
                                <tr>
                                    <th>Curp</th>
                                    <th>Rfc</th>
                                    <th>Nombre</th>
                                    <th>Ente Público</th>
                                    <th>Estatus</th>
                                    <th>Acción</th>
                                </tr>
                                </thead>
                                <tbody>
                                </tbody>
                            </table>

                        </div>
                    </div>
                </div>
            </div>

            <div class="alert alert-warning" id="idBoxUserNoREg" role="alert" style="display: none">
                <i class="fas fa-user"></i><span class="fw-bold"> No hay registros</span>
            </div>
        </section>
    </div>

    <th:block th:replace="catalogo/catUsuariosModalForm :: modalFormCatUsuario" />
    <th:block th:replace="catalogo/catEntePublicoPorUsuarioModal :: modalEntePublicoPorUsuario" />

</main>

<th:block th:replace="layout/mainLayout :: footer" />

<th:block th:replace="layout/mainLayout :: script" />
<script type="text/javascript" th:src="@{/js/catalogo/usuarios.js}"></script>
</body>
</html>
