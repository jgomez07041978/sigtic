<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="layout/mainLayout :: title" />

    <th:block th:replace="layout/mainLayout :: link" />
    <link th:href="@{/include/vakata-jstree-8c1bcc8/dist/themes/default/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="layout/mainLayout :: header"></div>

<div th:replace="layout/mainLayout :: sidebar"></div>

<main id="main" class="main">
    <div class="pagetitle">
        <h1 th:text="${titlePage}"></h1>
        <input type="hidden" name="idEntePublicoSession" id="idEntePublicoSession" th:value="${idEntePublicoSession}">
        <section class="section">
            <div class="row">
                <div class="col-lg-12">
                    <form id="formBusquedaUsuario">
                        <div class="card">
                            <div class="card-body">
                                <!--<input type="hidden" id="idEntePublico" name="idEntePublico">-->
                                <input type="hidden" id="idUnidadAdmtva" name="idUnidadAdmtva">
                                <div class="row">
                                    <div class="col-12">
                                        <div class="form-floating py-3">
                                            <select class="form-select form-select-lg" id="idEntePublico" name="idEntePublico">
                                            </select>
                                            <label for="idEntePublico">Ente Público</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="row g-2">
                                    <div class="col-md">
                                        <div class="input-group mb-3">
                                            <div class="form-floating py-1">
                                                <input type="text" class="form-control bg-secondary-subtle" id="descUnidadAdmtva" name="descUnidadAdmtva" readonly>
                                                <label for="descUnidadAdmtva">Unidad Administrativa</label>
                                            </div>
                                            <button class="btn btn-primary" type="button" id="btnOpenArbol"><i class="bi bi-diagram-3"></i></button>
                                            <button class="btn btn-danger" type="button" id="btnLimpiarUnidad"><i class="bi bi-x-circle"></i></button>

                                        </div>
                                    </div>
                                </div>

                                <!--
                                <div class="col-md-6">
                                    <div class="form-floating my-3">
                                        <input type="text" class="form-control bg-secondary-subtle" id="descEntePublico" name="descEntePublico" placeholder="Ente Público" readonly>
                                        <label for="descEntePublico">Ente Público</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="input-group my-3">
                                        <div class="form-floating">
                                            <input type="text" class="form-control bg-secondary-subtle"  id="descUnidadAdmtva" name="descUnidadAdmtva" placeholder="Unidad Administrativa">
                                            <label for="descUnidadAdmtva">Unidad Administrativa</label>
                                        </div>
                                        <button class="btn btn-primary" type="button" id="btnOpenArbol"><i class="bi bi-diagram-3"></i></button>
                                    </div>
                                </div>
                                -->
                                <div class="row">
                                    <div class="col-md-6">
                                        <label>Buscar</label>
                                        <input type="text" name="nombreUsuario" id="nombreUsuario" class="form-control">
                                    </div>
                                    <div class="col-md-6 mt-2"><br>
                                        <!--                                        <div class="form-check form-check-inline" th:if="${isAdministradorSigtic}">
                                                                                    <input type="checkbox" class="form-check-input" id="isNotEntePublico" name="isNotEntePublico">
                                                                                    <label class="form-check-label" for="isNotEntePublico">Sin Ente Público</label>
                                                                                </div>-->
                                        <div class="form-check form-check-inline">
                                            <input type="checkbox" class="form-check-input" id="idVigente" name="idVigente" checked>
                                            <label class="form-check-label" for="idVigente">Vigente</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input type="checkbox" class="form-check-input" id="idNoVigente" name="idNoVigente">
                                            <label class="form-check-label" for="idNoVigente">No Vigente</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input type="checkbox" class="form-check-input" id="idHistorico" name="idHistorico">
                                            <label class="form-check-label" for="idHistorico">Historico</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="card-footer">
                                <button type="submit" id="idBtnSearch" class="btn btn-primary btn-sm"><i class="fas fa-search"></i> Buscar</button>
                                <button type="button" id="idNuevoUsuario" th:if="${activeAgregar}" class="btn btn-info  btn-sm"><i class="bi bi-plus-circle-dotted"></i> Nuevo Usuario</button>
                                <button type="button" class="btn btn-warning btn-sm" th:if="${isAdministradorSigtic}" onclick="obtieneUsuariosSinDependencia()"><i class="fas fa-eye"></i> Usuarios sin Dependencia</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="row" style="display: none" id="idCardTablaUsuario">
                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex align-items-center highlight-toolbar ps-3 pe-2 py- border-0 border-bottom">
                                <small class="card-title">Listado de Usuarios</small>
                                <div class="d-flex ms-auto">

                                </div>
                            </div>
                            <table id="tableUsuario" th:if="${activeConsultar}" class="table table-striped table-hover table-sm"  style="width:100%">
                                <thead>
                                <tr>
                                    <th width="10%">Rfc</th>
                                    <th width="20%">Nombre</th>
                                    <th width="20%">Dependencia</th>
                                    <th width="20%">Unidad Administrativa</th>
                                    <th width="20%">Estatus</th>
                                    <th width="15%">Acción</th>
                                </tr>
                                </thead>
                                <tbody>
                                </tbody>
                            </table>

                        </div>
                    </div>
                </div>
            </div>

            <div class="alert alert-warning" id="idBoxUserNoREg" role="alert" style="display: none">
                <i class="fas fa-user"></i><span class="fw-bold"> No hay registros</span>
            </div>
        </section>
    </div>

    <th:block th:replace="catalogo/usuarioGeneralModalSinEnte.html :: modalTableroUsuarioSinEnte" />
    <th:block th:replace="catalogo/usuarioGeneralModalForm.html :: modalFormUsuario" />
    <th:block th:replace="layout/modalUnidadLayout :: modalUnidad" />
    <th:block th:replace="layout/modalUnidadLayout :: modalUnidad2" />
    <th:block th:replace="layout/modalUnidadLayout :: modalUnidad3" />
    <th:block th:replace="layout/modalUnidadLayout :: modalUnidad4" />

</main>

<th:block th:replace="layout/mainLayout :: footer" />

<th:block th:replace="layout/mainLayout :: script" />
<script type="text/javascript" th:src="@{/include/vakata-jstree-8c1bcc8/dist/jstree.min.js}"></script>
<script type="text/javascript" th:src="@{/js/catalogo/usuario_general.js}"></script>
<script type="text/javascript" th:src="@{/js/tree/tree-unidadades-admin-1.js}"></script>
<script type="text/javascript" th:src="@{/js/tree/tree-unidadades-admin-2.js}"></script>
<script type="text/javascript" th:src="@{/js/tree/tree-unidadades-admin-3.js}"></script>
<script type="text/javascript" th:src="@{/js/tree/tree-unidadades-admin-4.js}"></script>
</body>
</html>
