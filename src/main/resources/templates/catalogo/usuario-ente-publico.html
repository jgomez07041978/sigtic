<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="layout/mainLayout :: title" />

    <th:block th:replace="layout/mainLayout :: link" />
    <link th:href="@{/include/vakata-jstree-8c1bcc8/dist/themes/default/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="layout/mainLayout :: header"></div>

<div th:replace="layout/mainLayout :: sidebar"></div>

<main id="main" class="main">
    <div class="pagetitle">
        <h1 th:text="${titlePage}"></h1>
        <input type="hidden" name="idEntePublicoSession" id="idEntePublicoSession" th:value="${idEntePublicoSession}">
        <section class="section">
            <div class="row">
                <div class="col-lg-12">
                    <form id="formBusquedaUsuario">
                        <div class="card">
                            <div class="card-body">
                                <!--<input type="hidden" id="idEntePublico" name="idEntePublico">-->
                                <div class="row">
                                    <div class="col-12">
                                        <div class="form-floating py-3">
                                            <select class="form-select form-select-lg" id="idEntePublico" name="idEntePublico">
                                            </select>
                                            <label for="idEntePublico">Ente Público</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-6 mt-2"><br>
                                        <div class="form-check form-check-inline">
                                            <input type="checkbox" class="form-check-input" id="idVigente" name="idVigente" checked>
                                            <label class="form-check-label" for="idVigente">Vigente</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input type="checkbox" class="form-check-input" id="idHistorico" name="idHistorico" checked>
                                            <label class="form-check-label" for="idHistorico">Historico</label>
                                        </div>
                                    </div>
                                    <div class="col-6 mt-3">
                                        <div class="d-flex justify-content-end gap-1">
                                            <!-- Exportar con filtros actuales -->
                                            <button type="button"
                                                    id="btnExportarFiltro"
                                                    th:if="${activeConsultar}"
                                                    class="btn btn-success btn-sm"
                                                    onclick="exportarConFiltro()">
                                                <i class="bi bi-file-earmark-excel"></i> Exportar Filtro
                                            </button>

                                            <!-- Exportar todos -->
                                            <button type="button"
                                                    id="btnExportarTodos"
                                                    th:if="${activeConsultar}"
                                                    class="btn btn-success btn-sm"
                                                    onclick="exportarTodos()">
                                                <i class="bi bi-file-earmark-excel"></i> Exportar Todos
                                            </button>

                                            <!-- Alta Usuario -->
                                            <button type="button"
                                                    id="idNuevoUsuario"
                                                    th:if="${activeAgregar}"
                                                    class="btn btn-primary btn-lg">
                                                <i class="bi bi-person-plus"></i> Alta Usuario
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="row" id="idCardTablaUsuario">
                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex align-items-center highlight-toolbar ps-3 pe-2 py- border-0 border-bottom">
                                <small class="card-title">Listado de Usuarios</small>
                                <div class="d-flex ms-auto">

                                </div>
                            </div>
                            <table id="tableUsuario" th:if="${activeConsultar}" class="table table-striped table-hover table-sm"  style="width:100%">
                                <thead>
                                <tr>
                                    <th >CURP</th>
                                    <th >RFC</th>
                                    <th >Nombre</th>
                                    <th >Unidad Administrativa</th>
                                    <th >Estatus</th>
                                    <th >Acción</th>
                                </tr>
                                </thead>
                                <tbody>
                                </tbody>
                            </table>

                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <th:block th:replace="catalogo/usuario-ente-publico-modal.html :: modalAddUsuarioEntePublico" />
    <th:block th:replace="catalogo/usuario-ente-publico-modal.html :: modalSearchUsuario" />
    <th:block th:replace="servicio-tic/catUsuariosModalForm :: modalFormCatUsuario" />
    <th:block th:replace="layout/modalUnidadLayout :: modalUnidad" />
    <th:block th:replace="layout/modalUnidadLayout :: modalUnidad2" />
</main>

<th:block th:replace="layout/mainLayout :: footer" />

<th:block th:replace="layout/mainLayout :: script" />
<script type="text/javascript" th:src="@{/include/vakata-jstree-8c1bcc8/dist/jstree.min.js}"></script>
<script type="text/javascript" th:src="@{/js/catalogo/usuario_ente_publico.js}"></script>
<script type="text/javascript" th:src="@{/js/tree/tree-unidadades-admin-1.js}"></script>
<script type="text/javascript" th:src="@{/js/tree/tree-unidadades-admin-2.js}"></script>

</body>
</html>
