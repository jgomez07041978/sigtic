<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="layout/mainLayout :: title" />

    <th:block th:replace="layout/mainLayout :: link" />
    <link th:href="@{/include/vakata-jstree-8c1bcc8/dist/themes/default/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="layout/mainLayout :: header"></div>

<div th:replace="layout/mainLayout :: sidebar"></div>

<main id="main" class="main">
    <div class="pagetitle">
        <input type="hidden" id="generaToken" name="generaToken" th:value="${generaToken}">
        <input type="hidden" id="usuarioToken" name="usuarioToken" th:value="${usuarioToken}">
        <input type="hidden" id="secretToken" name="secretToken" th:value="${secretToken}">
        <input type="hidden" id="enviaCorreo" name="enviaCorreo" th:value="${enviaCorreo}">

        <h1 th:text="${titlePage}"></h1>
        <a href="/sigtic" id="urlSistema"></a>

        <section class="section">
            <div class="row">
                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Listado de Usuarios</h5>
                            <button type="button" id="idNuevoPreRegistro" th:if="${activeAgregar}" class="btn btn-primary"><i class="bi bi-plus-circle-dotted"></i> Nuevo Pre Registro</button>
                            <table id="tablePreRegistro" th:if="${activeConsultar}" class="table table-striped table-hover table-sm"  style="width:100%">
                                <thead>
                                <tr>
                                    <th>Curp</th>
                                    <th>Nombre Completo</th>
                                    <th>Correo Institucional</th>
                                    <th>Celular</th>
                                    <th>#Rol</th>
                                    <th>Estatus</th>
                                    <th>Acción</th>
                                </tr>
                                </thead>
                                <tbody>
                                </tbody>
                            </table>

                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>


    <div class="modal fade" id="dlgModalFormPreRegistro" aria-labelledby="dlgModalFormPreRegistroLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><span id="titleFormPreRegistro"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>
                <form id="formPreRegistro" method="post">
                    <div class="modal-body body-modal">

                        <input type="hidden" id="idUsuarioTemporal" name="idUsuarioTemporal">
                        <div class="d-grid gap-2">
                            <div class="input-group mb-3">
                                <div class="form-floating myb-3">
                                    <input type="email" class="form-control" id="correoInstitucional" name="correoInstitucional" placeholder="Correo Institucional">
                                    <label for="correoInstitucional"><span class="text-danger fw-bold">*</span> Correo Institucional</label>
                                </div>
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <div class="row g-2">
                                <div class="col-sm-12 col-md-6 col-xl-6 col-xxl-6">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control"  id="rfc" name="rfc" placeholder="RFC" onkeyup="mayus(this);">
                                        <label for="rfc">RFC</label>
                                    </div>
                                </div>
                                <div class="col-sm-12 col-md-6 col-xl-6 col-xxl-6">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control"  id="curp" name="curp" placeholder="CURP" onkeyup="mayus(this);">
                                        <label for="curp">CURP</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <div class="row g-2">
                                <div class="col-3">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control"  id="nombre" name="nombre" placeholder="Nombre">
                                        <label for="nombre"><span class="text-danger fw-bold">*</span> Nombre</label>
                                    </div>
                                </div>
                                <div class="col-3">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control"  id="segundoNombre" name="segundoNombre" placeholder="Segundo Nombre">
                                        <label for="segundoNombre">Segundo Nombre</label>
                                    </div>
                                </div>
                                <div class="col-3">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control"  id="apellidoPaterno" name="apellidoPaterno" placeholder="Apellido Paterno">
                                        <label for="apellidoPaterno"><span class="text-danger fw-bold">*</span> Apellido Paterno</label>
                                    </div>
                                </div>
                                <div class="col-3">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control"  id="apellidoMaterno" name="apellidoMaterno" placeholder="Apellido Materno">
                                        <label for="apellidoMaterno"><span class="text-danger fw-bold">*</span> Apellido Materno</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <div class="input-group mb-3">
                                <div class="form-floating myb-3">
                                    <input type="text" class="form-control" id="dependencia" name="dependencia" placeholder="Ente Público">
                                    <label for="dependencia"><span class="text-danger fw-bold">*</span> Nombre Ente Público</label>
                                </div>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <div class="input-group mb-3">
                                <div class="form-floating myb-3">
                                    <input type="text" class="form-control" id="oficio" name="oficio" placeholder="Oficio de Respuesta">
                                    <label for="oficio"><span class="text-danger fw-bold">*</span>  Oficio de Respuesta</label>
                                </div>
                            </div>
                        </div>

                        <div class="row g-2">
                            <div class="col-9">
                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control"  id="correoPersonal" name="correoPersonal" placeholder="Correo Electrónico Personal">
                                    <label for="correoPersonal"> Correo Electrónico Personal</label>
                                </div>
                            </div>
                            <div class="col-3">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control"  id="numCelular" name="numCelular"  minlength="10"  maxlength="10" placeholder="Celular Personal">
                                    <label for="numCelular"> Celular Personal</label>
                                </div>
                            </div>
                        </div>
                        <div class="row g-2">
                            <div class="col-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control"  id="telefonoInstitucional" name="telefonoInstitucional" minlength="10"  maxlength="10" placeholder="Teléfono Institucional">
                                    <label for="telefonoInstitucional"> Teléfono Institucional</label>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control"  id="extensionInstitucional" name="extensionInstitucional" placeholder="Extensión">
                                    <label for="extensionInstitucional"> Extensión</label>
                                </div>
                            </div>
                        </div>

                    </div>
                    <div class="modal-footer my-0">
                        <button type="submit"  class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cerrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <div class="modal fade" id="dlgModalRolPreRegistro" aria-labelledby="dlgModalRolPreRegistroLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Roles Asignados</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>
                <div class="modal-body body-modal">
                    <div class="card-body">
                        <h5><span class="fw-bold">Correo Institucional:</span> <span id="correoPreRegistro"></span></h5>
                        <br/>
                        <form id="formPreRegistroRol" method="post">
                                <input type="hidden" id="idUsuarioTemporalPr" name="idUsuarioTemporalPr">
                                <div class="d-grid gap-2">
                                    <div class="input-group mb-3">
                                        <div class="form-floating myb-3">
                                            <select class="form-select form-select-lg select2me" id="cbRol" name="cbRol">
                                            </select>
                                            <label for="cbRol">Seleccione Rol</label>
                                        </div>
                                        <button type="submit"  class="btn btn-primary"><i class="fas fa-circle-plus"></i> Agregar</button>
                                    </div>
                                </div>
                        </form>
                        <br/>

                        <table id="tablaRolPreRegistro" class="table table-striped" style="width:100%">
                            <thead>
                            <tr>
                                <th>Rol</th>
                                <th>Acción</th>
                            </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer my-0">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cerrar</button>
                </div>
            </div>
        </div>
    </div>

</main>


<th:block th:replace="layout/mainLayout :: footer" />

<th:block th:replace="layout/mainLayout :: script" />
<script type="text/javascript" th:src="@{/include/vakata-jstree-8c1bcc8/dist/jstree.min.js}"></script>
<script type="text/javascript" th:src="@{/js/seguridad/pre-registro-admin.js}"></script>
</body>
</html>
