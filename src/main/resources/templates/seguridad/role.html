<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="layout/mainLayout :: title" />

    <th:block th:replace="layout/mainLayout :: link" />
    <link th:href="@{/include/vakata-jstree-8c1bcc8/dist/themes/default/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="layout/mainLayout :: header"></div>

<div th:replace="layout/mainLayout :: sidebar"></div>

<main id="main" class="main">
    <div class="pagetitle">
        <h1 th:text="${titlePage}"></h1>

        <section class="section">
            <div class="row">
                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Listado de Roles</h5>
                            <button type="button" id="idNuevoRol" th:if="${activeAgregar}" class="btn btn-primary"><i class="bi bi-plus-circle-dotted"></i> Nuevo Rol</button>
                            <table id="tableSegRoles" th:if="${activeConsultar}" class="table table-striped table-hover table-sm"  style="width:100%">
                                <thead>
                                <tr>
                                    <th>Nombre del Perfil</th>
                                    <th>Descripción del Perfil</th>
                                    <th>Usuarios</th>
                                    <th>Estatus</th>
                                    <th>Acción</th>
                                </tr>
                                </thead>
                                <tbody>
                                </tbody>
                            </table>

                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>


    <th:block th:replace="seguridad/roleModal :: modalPerfil" />

</main>


<th:block th:replace="layout/mainLayout :: footer" />

<th:block th:replace="layout/mainLayout :: script" />
<script type="text/javascript" th:src="@{/include/vakata-jstree-8c1bcc8/dist/jstree.min.js}"></script>
<script type="text/javascript" th:src="@{/js/seguridad/role.js}"></script>
</body>
</html>
