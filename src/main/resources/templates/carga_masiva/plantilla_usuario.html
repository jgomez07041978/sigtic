<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="layout/mainLayout :: title" />

    <th:block th:replace="layout/mainLayout :: link" />
    <link th:href="@{/include/vakata-jstree-8c1bcc8/dist/themes/default/style.css}" rel="stylesheet">
    <link th:href="@{/include/css_personalizado/general.css}" rel="stylesheet">
</head>
<body>
<div th:replace="layout/mainLayout :: header"></div>

<div th:replace="layout/mainLayout :: sidebar"></div>

<main id="main" class="main">
    <div class="pagetitle">
        <h1 th:text="${titlePage}"></h1>
        <section class="section">
            <div class="row">
                <div class="col-lg-12">
                    <div class="row">
                        <div class="col-lg-12">
                            <form id="formBusquedaUsuarioPlantilla">
                                <div class="card">
                                    <div class="card-body">
                                        <br/>
                                        <div class="row g-2">
                                            <div class="col-12">
                                                <div class="form-floating  py-3">
                                                    <select class="form-select form-select-lg" id="idEntePublico" name="idEntePublico">
                                                    </select>
                                                    <label for="idEntePublico">Ente Público</label>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row g-2">
                                            <div class="col-3">
                                                <div class="form-floating mb-3">
                                                    <input type="text" class="form-control"  id="rfc" name="rfc" placeholder="RFC">
                                                    <label for="rfc"> RFC</label>
                                                </div>
                                            </div>

                                            <div class="col-3">
                                                <div class="form-floating mb-3">
                                                    <input type="text" class="form-control"  id="curp" name="curp" placeholder="CURP">
                                                    <label for="curp"> CURP</label>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row g-2">
                                            <div class="col-4">
                                                <div class="form-floating mb-3">
                                                    <input type="text" class="form-control"  id="nombre" name="nombre" placeholder="Nombre">
                                                    <label for="nombre"> Nombre</label>
                                                </div>
                                            </div>

                                            <div class="col-4">
                                                <div class="form-floating mb-3">
                                                    <input type="text" class="form-control"  id="apellidoPaterno" name="apellidoPaterno" placeholder="Apellido Paterno">
                                                    <label for="apellidoPaterno"> Apellido Paterno</label>
                                                </div>
                                            </div>
                                            <div class="col-4">
                                                <div class="form-floating mb-3">
                                                    <input type="text" class="form-control"  id="apellidoMaterno" name="apellidoMaterno" placeholder="Apellido Materno">
                                                    <label for="apellidoMaterno"> Apellido Materno</label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="card-footer">
                                        <button type="submit" id="idBtnSearch" class="btn btn-primary btn-sm"><i class="fas fa-search"></i> Buscar</button>
                                        <button type="button" id="idBtnLimpiar" class="btn btn-warning btn-sm"><i class="fas fa-eraser"></i> Limpiar</button>
                                    </div>
                                </div>
                            </form>


                            <div class="card" id="idCardTablaPlantillaUsuario" style="display: none">
                                <div class="card-body pt-2">

                                    <nav style="display: none" id="paginationNav">
                                        <ul class="pagination pagination-lg justify-content-center">
                                            <li class="page-item" id="primeraPag">
                                                <a class="page-link" onclick="primeraPagina()">Primera</a>
                                            </li>
                                            <li class="page-item" id="previousPag">
                                                <a class="page-link" onclick="anteriorPagina()">Anterior</a>
                                            </li>
                                            <li class="page-item">
                                                <div class="form-floating mb-3">
                                                    <input type="number" class="form-control text-center fw-bold" id="actualPage" placeholder="">
                                                    <label for="actualPage">Página Actual</label>
                                                </div>

                                            </li>
                                            <li class="page-item">
                                                <a class="page-link fw-bold text-center"><span id="infoPag"></span></a>
                                            </li>
                                            <li class="page-item" id="nextPag">
                                                <a class="page-link" href="#" onclick="siguientePagina()" >Siguiente</a>
                                            </li>
                                            <li class="page-item" id="lastPag">
                                                <a class="page-link" onclick="ultimaPagina()">Última</a>
                                            </li>
                                        </ul>
                                        <div class="text-center fw-bold">
                                            <span id="totalRegistro"></span>
                                        </div>
                                    </nav>

                                    <table id="tableUsuarioPlantilla" th:if="${activeConsultar}" class="table table-striped table-hover table-sm"  style="width:100%">
                                        <thead>
                                        <tr>
                                            <th>CURP</th>
                                            <th>Apellido Paterno</th>
                                            <th>Apellido Materno</th>
                                            <th>Nombre</th>
                                            <th>Entidad</th>
                                            <th>Unidad Administrativa</th>
                                            <th>No. Plantilla</th>
                                            <th>Estatus</th>
                                            <th>Acciones</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </div>

   <th:block th:replace="carga_masiva/plantillaUsuarioModal :: modalPlantillaUsuario" />

</main>


<th:block th:replace="layout/mainLayout :: footer" />
<th:block th:replace="layout/mainLayout :: script" />
<script type="text/javascript" th:src="@{/js/carga_masiva/plantilla_usuario.js}"></script>

</body>
</html>
