<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="layout/mainLayout :: title" />

    <th:block th:replace="layout/mainLayout :: link" />
    <link th:href="@{/include/vakata-jstree-8c1bcc8/dist/themes/default/style.css}" rel="stylesheet">
    <link th:href="@{/include/css_personalizado/general.css}" rel="stylesheet">
</head>
<body>
<div th:replace="layout/mainLayout :: header"></div>

<div th:replace="layout/mainLayout :: sidebar"></div>

<main id="main" class="main">
    <div class="pagetitle">
        <h1 th:text="${titlePage}"></h1>
        <section class="section">
            <div class="row">
                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-body pt-3">
                            <form id="formCarga" role="form">
                                <div class="d-grid gap-2">
                                    <div class="row" id="idMsgPlantillaEdit" style="display: none">
                                        <div class="col-12">
                                            <div class="alert alert-warning" role="alert">
                                                Se esta actualizando la carga de la plantilla <span id="nomPlantillaEdit"></span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-6">
                                            <div class="form-floating">
                                                <input type="hidden" id="idCargaDatosPlantilla">
                                                <select class="form-select" id="plantilla" name="plantilla">
                                                </select>
                                                <label for="plantilla">Plantilla</label>
                                            </div>
                                        </div>
                                        <div class="col-6" th:if="${activeAgregar}">
                                            <div class="form-floating">
                                                <input type="date" class="form-control"  id="fechaCorte" name="fechaCorte" placeholder="Fecha de Corte">
                                                <label for="fechaCorte"><span class="text-danger fw-bold">*</span> Fecha de Corte</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row" th:if="${activeAgregar}">
                                        <div class="col-8">
                                                <!--<label for="archivo" class="form-label">Archivo a Cargar</label>-->
                                                <input class="form-control form-control-lg" type="file" id="archivo" name="archivo">
                                        </div>
                                        <div class="col-4 pt-2">
                                            <div class="row">
                                                <div class="col-6">
                                                    <button type="submit" class="btn btn-primary">
                                                        <i class="fas fa-upload"></i> Cargar
                                                    </button>
                                                    <button type="button" class="btn btn-warning" onclick="clearSubirPlantilla()">
                                                        <i class="fas fa-eraser"></i> Limpiar
                                                    </button>
                                                </div>
                                                <div class="col-6">
                                                    <a href="#" id="descargaPl" target="_blank" style="display: none"><i class="fas fa-download"></i>  Plantilla Sistema</a>
                                                    <br/>
                                                    <a href="#" id="descargaPersonalizada" target="_blank" style="display: none"><i class="fas fa-download"></i> Plantilla XLSX</a>
                                                </div>
                                            </div>

                                        </div>
                                    </div>

                                </div>
                            </form>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="card">
                                <div class="card-body pt-3">

                                    <table id="tableCargaMasiva" th:if="${activeConsultar}" class="table table-striped table-hover table-sm"  style="width:100%">
                                        <thead>
                                        <tr>
                                            <th>Plantilla</th>
                                            <th>Fecha Corte</th>
                                            <th>Fecha Carga</th>
                                            <th>Usuario</th>
                                            <th>Registros Cargados</th>
                                            <th>Núm. Error</th>
                                            <th>Estatus</th>
                                            <th>Acción</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </div>

    <th:block th:replace="carga_masiva/cargaMasivaModal :: modalCargaMasiva" />

</main>


<th:block th:replace="layout/mainLayout :: footer" />
<th:block th:replace="layout/mainLayout :: script" />
<script type="text/javascript" th:src="@{/js/carga_masiva/carga-masiva.js}"></script>

</body>
</html>
