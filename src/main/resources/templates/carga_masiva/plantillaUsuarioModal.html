<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<th:block th:fragment="modalPlantillaUsuario">

    <div class="modal fade" id="dlgModalPlantillaUSuario" aria-labelledby="dlgModalPlantillaUSuarioLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Asignación de Plantillas</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>
                <div class="modal-body body-modal">
                    <div class="card">
                        <div class="card-body pt-2">
                            <h5><span id="nombreUserParam"></span></h5>
                            <input type="hidden" id="usuario">
                            <input type="hidden" id="idEntePublicoTemp">
                            <input type="hidden" id="idUnidadAdministrativaTemp">
                            <div class="row">
                                <div class="col-6">
                                    <table id="tableDispoPlantilla" class="table table-striped table-bordered table-sm" style="width:100%">
                                        <thead>
                                        <tr>
                                            <th>Plantillas Disponibles</th>
                                            <th></th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        </tbody>
                                    </table>
                                </div>
                                <div class="col-6">
                                    <table id="tableAsigPlantilla" class="table table-striped table-bordered table-sm" style="width:100%">
                                        <thead>
                                        <tr>
                                            <th></th>
                                            <th>Plantillas Asignadas</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
                <div class="modal-footer my-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cerrar</button>
                    <br/>
                </div>
            </div>
        </div>
    </div>

</th:block>



</body>
</html>
