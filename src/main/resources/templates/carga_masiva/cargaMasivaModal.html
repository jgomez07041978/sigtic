<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<th:block th:fragment="modalCargaMasiva">

    <div class="modal fade" id="dlgModalListaCargaMasiva" aria-labelledby="dlgModalListaCargaMasivaLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><span id="titlePlantilla" class="fw-bold"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>
                <div class="modal-body body-modal">
                    <table id="tableCargaMasivaDetalle" th:if="${activeConsultar}" class="table table-striped table-hover table-sm"  style="width:100%">
                    </table>

                </div>
                <div class="modal-footer my-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cerrar</button>
                    <br/>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="dlgModalListaCargaMasivaError" aria-labelledby="dlgModalListaCargaMasivaErrorLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><span id="titlePlantillaError" class="fw-bold"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>
                <div class="modal-body body-modal">
                    <table id="tableCargaMasivaError" th:if="${activeConsultar}" class="table table-striped table-hover table-sm"  style="width:100%">
                        <thead>
                        <tr>
                            <th>Núm Línea</th>
                            <th>Columna</th>
                            <th>Descripción Error</th>
                            <th>Fecha Registro</th>
                        </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>

                </div>
                <div class="modal-footer my-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cerrar</button>
                    <br/>
                </div>
            </div>
        </div>
    </div>

</th:block>

</body>
</html>
