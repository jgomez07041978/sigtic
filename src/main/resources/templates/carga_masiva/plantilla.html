<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="layout/mainLayout :: title" />

    <th:block th:replace="layout/mainLayout :: link" />
    <link th:href="@{/include/vakata-jstree-8c1bcc8/dist/themes/default/style.css}" rel="stylesheet">
    <link th:href="@{/include/css_personalizado/general.css}" rel="stylesheet">
</head>
<body>
<div th:replace="layout/mainLayout :: header"></div>

<div th:replace="layout/mainLayout :: sidebar"></div>

<main id="main" class="main">
    <div class="pagetitle">
        <h1 th:text="${titlePage}"></h1>
        <section class="section">
            <div class="row">
                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex align-items-center highlight-toolbar ps-3 pe-2 py-1 border-0 border-top border-bottom">
                               <!-- <small class="card-title">Listado de Plantillas</small>-->
                                <div class="d-flex ms-auto">
                                    <button type="button" id="idNuevaPlantilla" th:if="${activeAgregar}" class="btn btn-primary btn-sm"><i class="fas fa-plus"></i> Nueva Plantilla</button>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-lg-12">
                                    <div class="card">
                                        <div class="card-body">
                                            <div class="d-flex align-items-center highlight-toolbar ps-3 pe-2 py- border-0 border-bottom">
                                                <small class="card-title">Listado de Plantilla</small>
                                                <div class="d-flex ms-auto">

                                                </div>
                                            </div>
                                            <table id="tablePlantillas" class="table table-striped table-bordered" style="width:100%">
                                                <thead>
                                                <tr>
                                                    <th>Id</th>
                                                    <th>Descripción</th>
                                                    <th>Nombre Archivo</th>
                                                    <th>Campos <a href="#"  data-bs-toggle='tooltip' data-bs-placement='top' data-bs-html="true" data-bs-title="<em>Campos Capturados</em> <strong>/</strong> <em>Campos de la Plantilla</em>">
                                                        <i class="fa fa-question-circle" aria-hidden="true"></i></a>
                                                    </th>
                                                    <th>Estatus</th>
                                                    <th>Acción</th>
                                                </tr>
                                                </thead>
                                                <tbody>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <th:block th:replace="layout/modalUnidadLayout :: modalUnidad" />
    <th:block th:replace="carga_masiva/plantillaModal :: modalPlantilla" />
    <th:block th:replace="carga_masiva/plantillaModal :: modalCampos" />
    <th:block th:replace="carga_masiva/plantillaModal :: modalCamposForm" />
    <th:block th:replace="carga_masiva/plantillaModal :: modalPlantillaUpload" />



</main>


<th:block th:replace="layout/mainLayout :: footer" />
<th:block th:replace="layout/mainLayout :: script" />
<script type="text/javascript" th:src="@{/include/vakata-jstree-8c1bcc8/dist/jstree.min.js}"></script>
<script type="text/javascript" th:src="@{/js/tree/tree-unidadades-admin-1.js}"></script>
<script type="text/javascript" th:src="@{/js/carga_masiva/plantilla.js}"></script>


</body>
</html>
