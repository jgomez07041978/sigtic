<th:block th:fragment="modalUnidad">

    <div class="modal fade" id="modal_arbol_unidad" aria-labelledby="modal_arbol_unidadLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Unidades Administrativas</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>
                <div class="modal-body body-modal">

                            <div class="form-floating my-1">
                                <input type="text" class="form-control fw-bold" id="txtBuscar" name="txtBuscar" placeholder="Buscar..." autofocus>
                                <label for="txtBuscar">Buscar...</label>
                            </div>
                            <div class="row">
                                <div class="col" style="margin-bottom:10px; padding-right:20px; border-right: 1px solid lightgray; overflow: scroll; height:450px;">
                                    <input type="hidden" id="idPadreArbol" name="idPadreArbol" value="0">
                                    <div id="arbol"></div>
                                </div>
                            </div>
                </div>
                <div class="modal-footer my-0">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cerrar</button>
                </div>
            </div>
        </div>
    </div>

</th:block>
