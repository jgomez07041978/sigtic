<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>



<th:block th:fragment="modalCartaResponsiva">

    <!--MODAL DE PRIMERA PANTALLA ENTE PUBLICO-->

    <div class="modal fade" id="dlgModalCartaResponsiva" aria-labelledby="dlgModalCartaResponsivaLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-fullscreen modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><span class="fw-bold">Carta Responsiva con Folio: <span id="idFolioCr"></span></span></h5>
                   <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>

                <div class="modal-body body-modal">
                    <div class="card py-2">
                        <div class="card-body">
                            <div class="mb-1 row">
                                <label for="idTipoServicioMd" class="col-sm-2 col-form-label fw-bold">Tipo de Servicio</label>
                                <div class="col-sm-10">
                                    <input type="text" readonly class="form-control-plaintext" id="idTipoServicioMd">
                                </div>
                            </div>
                            <div class="mb-1 row">
                                <label for="idSubTipoServicioMd" class="col-sm-2 col-form-label fw-bold">SubTipo de Servicio</label>
                                <div class="col-sm-7">
                                    <input type="text" readonly class="form-control-plaintext"  id="idSubTipoServicioMd">
                                </div>
                            </div>
                            <table id="tableCartaResponsivaDetalle" class="table table-striped table-hover table-sm"  style="width:100%">
                                <thead>
                                <tr>
                                    <th>Clave Servicio</th>
                                    <th>Nombre Servicio</th>
                                    <th>Estado Servicio</th>
                                    <th>Estatus Servicio</th>
                                    <th>Estatus</th>
                                </tr>
                                </thead>
                                <tbody>
                                </tbody>
                            </table>
                        </div>
                    </div>


                </div>
                <div class="modal-footer my-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cerrar</button>
                    <br/>
                </div>
            </div>
        </div>
    </div>


    <div class="modal fade" id="dlgModalUploadCartaResponsiva" aria-labelledby="dlgModalUploadCartaResponsivaLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><span class="fw-bold">Adjuntar Carta Responsiva</span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>
                <div class="modal-body body-modal">
                    <form id="frmUpload" name="frmUpload">
                        <input type="hidden" id="idCartaResponsivaUpload" name="idCartaResponsivaUpload">
                        <div class="row"><div class="col-10">
                            <div class="form-group mb-3">
                                <label for="ruta_carta_responsiva">Archivo</label>
                                <div class="custom-file">
                                    <input type="file" accept="application/pdf" class="custom-file-input" id="ruta_carta_responsiva">
                                    <label class="custom-file-label" data-browse="Elegir" for="ruta_carta_responsiva">Seleccionar</label>
                                </div>

                            </div>
                        </div>
                            <div class="col-2 mt-4"><button type="button"  class="btn btn-primary btn-sm" id="idBtnSubirDoc" onclick="adjuntar()"><i class='fas fa-paperclip'></i> Adjuntar</button></div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer my-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cerrar</button>
                    <br/>
                </div>
            </div>
        </div>
    </div>


    <div class="modal fade" id="dlgModalPassword" aria-labelledby="dlgModalPasswordLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Datos de la contraseña temporal para los servicios</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>
                <div class="modal-body body-modal">

                    <div class="mb-1 row">
                        <label for="idPwdService" class="col-sm-4 col-form-label fw-bold">Contraseña Temporal:</label>
                        <div class="col-sm-8">
                            <input type="text" readonly class="form-control-plaintext" id="idPwdService">
                        </div>
                    </div>
                    <div class="mb-1 row">
                        <label for="idFechaPwd" class="col-sm-4 col-form-label fw-bold">Fecha Temporal :</label>
                        <div class="col-sm-8">
                            <input type="text" readonly class="form-control-plaintext"  id="idFechaPwd">
                        </div>
                    </div>

                </div>
                <div class="modal-footer my-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cerrar</button>
                    <br/>
                </div>
            </div>
        </div>
    </div>


</th:block>
<th:block th:fragment="modalCartaResponsivaAceptada">
    <div class="modal fade" id="dlgModalAceptarCr" aria-labelledby="dlgModalAceptarCrLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><span class="fw-bold">Aceptar Carta Responsiva</span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>

                <div class="modal-body body-modal">
                    <div class="card">
                        <div class="card-body">

                            <div class="card">
                                <div class="card-body ">

                                    <div class="row">
                                        <div class="col-12 fs-4">
                                            <div id="idNombreReporte"></div><br>
                                            <div id="idTitleReporte"></div><br>
                                            <div id="fechaReporte"></div><br>
                                            <div id="folioReporte"></div><br>
                                            <div  id="idCuerpoReporte"></div>
                                        </div>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="inlineRadioOptions" id="idRechazarCr" value="1">
                                        <label class="form-check-label" for="idRechazarCr">Rechazo Carta Responsiva</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="inlineRadioOptions" id="idAceptarCr" value="2">
                                        <label class="form-check-label" for="idAceptarCr">Acepto Carta Responsiva</label>
                                    </div>
                                    <br><br>
                                    <div class="d-grid gap-2">
                                        <div class="form-floating">
                                            <textarea class="form-control" placeholder="Leave a comment here" id="motivoRechazo" name="motivoRechazo" style="height: 100px"></textarea>
                                            <label for="motivoRechazo" id="motivoRechazoLabel">Motivo de Rechazo</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer my-0">
                    <button type="button" id="btnAceptar" onclick="confirmarCr()"  class="btn btn-primary btn-lg"><i class="fa-regular fa-floppy-disk"></i> Confirmo</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cerrar</button>
                    <br/>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="dlgModalCrAceptada" aria-labelledby="dlgModalCrAceptadaLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><span class="fw-bold">Carta Responsiva Aceptada</span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>

                <div class="modal-body body-modal">
                    <div class="card">
                        <div class="card-body">

                            <div class="card">
                                <div class="card-body ">

                                    <div class="row">
                                        <div class="col-12 fs-4">
                                            <div id="idNombreReporteA"></div><br>
                                            <div id="idTitleReporteA"></div><br>
                                            <div id="fechaReporteA"></div><br>
                                            <div id="folioReporteA"></div><br>
                                            <div  id="idCuerpoReporteA"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer my-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cerrar</button>
                    <br/>
                </div>
            </div>
        </div>
    </div>

</th:block>

</body>
</html>
