<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="layout/mainLayout :: title" />

    <th:block th:replace="layout/mainLayout :: link" />
    <link th:href="@{/include/vakata-jstree-8c1bcc8/dist/themes/default/style.css}" rel="stylesheet">
    <link th:href="@{/include/css_personalizado/general.css}" rel="stylesheet">
</head>
<body>
<div th:replace="layout/mainLayout :: header"></div>

<div th:replace="layout/mainLayout :: sidebar"></div>

<main id="main" class="main">
    <div class="pagetitle">
        <h1 th:text="${titlePage}"></h1>
        <input type="hidden" name="idEntePublicoSession" id="idEntePublicoSession" th:value="${idEntePublicoSession}">
        <input type="hidden" name="isRolEnlaceTicServicio" id="isRolEnlaceTicServicio" th:value="${isRolEnlaceTicServicio}">

        <section class="section">
            <div class="row">
                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-body pt-3">
                            <div class="d-flex align-items-center highlight-toolbar ps-3 pe-2 py-1 border-0 border-top border-bottom">
                                <div class="d-flex ms-auto">
                                    <button type="button" id="idNuevoServicio" th:if="${activeAgregar}" class="btn btn-primary"><i class="bi bi-plus-circle-dotted"></i> Nuevo</button>
                                    <!--<a target="_blank" th:href="@{'/api/catalogo/tic/reporte/42'}">Reporte</a>-->
                                </div>
                            </div>
                            <div class="row" id="idCardTablaAdmin">
                                <div class="col-lg-12">
                                    <div class="card">
                                        <div class="card-body">
                                            <div class="d-flex align-items-center highlight-toolbar ps-3 pe-2 py- border-0 border-bottom">
                                                <!--<small class="card-title">Mis Servicios</small>-->
                                                <div class="d-flex ms-auto">

                                                </div>
                                            </div>
                                            <table id="tableMisServicios" th:if="${activeConsultar}" class="table table-striped table-hover table-sm"  style="width:100%">
                                                <thead>
                                                <tr>
                                                    <th>CURP</th>
                                                    <th>Nombre</th>
                                                    <th>Unidad Administrativa Opera</th>
                                                    <th>Tipo de Servico</th>
                                                    <th>Subtipo de Servicio</th>
                                                    <th>Descripción del Servicio</th>
                                                    <th>Estatus Seguimiento</th>
                                                    <th>Estatus</th>
                                                    <th>Acción</th>
                                                </tr>
                                                </thead>
                                                <tbody>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div class="modal fade" id="dlgModalRechazarServicio" aria-labelledby="dlgModalRechazarServicioLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Rechazar Servicio</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>
                <div class="modal-body body-modal">
                    <div class="d-grid gap-2">
                        <div class="row">
                            <div class="form-floating">
                                <textarea class="form-control" placeholder="Motivo de Rechazo" id="idMotivoRechazo"  name="idMotivoRechazo" style="height: 100px" maxlength="2000"></textarea>
                                <label for="idMotivoRechazo"><span class="text-danger fw-bold">*</span> Mótivo de Rechazo</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer my-0">
                    <button type="button"  class="btn btn-danger" onclick="rechazarButton()"><i class="fa-solid fa-rotate-left"></i> Rechazar</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cerrar</button>
                    <br/>
                </div>

            </div>
        </div>
    </div>

    <th:block th:replace="servicio-tic/servicioModal.html :: modalServicio" />
    <th:block th:replace="layout/modalUnidadLayout :: modalUnidad" />
    <th:block th:replace="layout/modalUnidadLayout :: modalUnidad2" />
    <th:block th:replace="layout/modalUnidadLayout :: modalUnidad3" />

</main>


<th:block th:replace="layout/mainLayout :: footer" />

<th:block th:replace="layout/mainLayout :: script" />

<script type="text/javascript" th:src="@{/include/vakata-jstree-8c1bcc8/dist/jstree.min.js}"></script>
<script type="text/javascript" th:src="@{/js/servicio-tic/seguimiento-servicios.js}"></script>
<script type="text/javascript" th:src="@{/js/tree/tree-unidadades-admin-1.js}"></script>
<script type="text/javascript" th:src="@{/js/tree/tree-unidadades-admin-2.js}"></script>
<script type="text/javascript" th:src="@{/js/tree/tree-unidadades-admin-3.js}"></script>
</body>
</html>
