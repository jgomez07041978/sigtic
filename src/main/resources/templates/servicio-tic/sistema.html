<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="layout/mainLayout :: title" />
    <th:block th:replace="layout/mainLayout :: link" />
    <link th:href="@{/include/vakata-jstree-8c1bcc8/dist/themes/default/style.css}" rel="stylesheet">
    <link th:href="@{/include/css_personalizado/general.css}" rel="stylesheet">
</head>
<body>
<div th:replace="layout/mainLayout :: header"></div>
<div th:replace="layout/mainLayout :: sidebar"></div>

<main id="main" class="main">
    <div class="pagetitle">
        <h1 th:text="${titlePage}"></h1>
        <input type="hidden" name="idEntePublicoSession" id="idEntePublicoSession" th:value="${idEntePublicoSession}">

        <section class="section">
            <div class="row">
                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-body pt-3">
                            <div class="d-flex align-items-center highlight-toolbar ps-3 pe-2 py-1 border-0 border-top border-bottom">
                                <small class="card-title">Listado de Sistemas</small>
                                <div class="d-flex ms-auto gap-1">
                                    <button type="button" id="btnExportarSistemas" th:if="${activeConsultar}" class="btn btn-success btn-sm" onclick="exportarSistemasEnte()" disabled>
                                        <i class="bi bi-file-earmark-excel"></i> Exportar
                                    </button>
                                    <a th:href="@{/api/catalogo/tic/exportarSistemasTotal}" th:if="${activeConsultar}" class="btn btn-outline-success btn-sm">
                                        <i class="bi bi-file-earmark-excel"></i> Exportar Todo
                                    </a>
                                    <button type="button" id="idNuevoSistema" th:if="${activeAgregar}" class="btn btn-primary btn-sm" disabled>
                                        <i class="bi bi-plus-circle-dotted"></i> Nuevo
                                    </button>
                                </div>
                            </div>
                            <th:block th:replace="layout/combos :: comboDependencia" />
                            <th:block th:replace="layout/combos :: comboUnidades" />
                            <div class="row g-2">
                                <div class="col-6 mt-2"><br>
                                    <div class="form-check form-check-inline">
                                        <input type="checkbox" class="form-check-input" id="administra" name="administra" checked>
                                        <label class="form-check-label" for="administra">Administra</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input type="checkbox" class="form-check-input" id="opera" name="opera" checked>
                                        <label class="form-check-label" for="opera">Opera</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row" id="idCardTablaAdmin">
                                <div class="col-lg-12">
                                    <div class="card">
                                        <div class="card-body">
                                            <div class="d-flex align-items-center highlight-toolbar ps-3 pe-2 py- border-0 border-bottom">
                                                <small class="card-title">Listado de Sistemas</small>
                                                <div class="d-flex ms-auto"></div>
                                            </div>
                                            <table id="tableSistema" th:if="${activeConsultar}" class="table table-striped table-hover table-sm" style="width:100%">
                                                <thead>
                                                <tr>
                                                    <th>Código Sistema</th>
                                                    <th>Descripción del Sistema</th>
                                                    <th>Tipo de Sistema</th>
                                                    <th>Ente Público/Unidad (Administra)</th>
                                                    <th>Ente Público/Unidad (Opera)</th>
                                                    <th>Estatus</th>
                                                    <th>Acción</th>
                                                </tr>
                                                </thead>
                                                <tbody></tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <th:block th:replace="servicio-tic/sistemaModal.html :: modalSistema" />
    <th:block th:replace="layout/modalUnidadLayout :: modalUnidad" />
    <th:block th:replace="layout/modalUnidadLayout :: modalUnidad2" />
    <th:block th:replace="layout/modalUnidadLayout :: modalUnidad3" />
</main>

<th:block th:replace="layout/mainLayout :: footer" />
<th:block th:replace="layout/mainLayout :: script" />
<script type="text/javascript" th:src="@{/include/vakata-jstree-8c1bcc8/dist/jstree.min.js}"></script>
<script type="text/javascript" th:src="@{/js/servicio-tic/sistema.js}"></script>
<script type="text/javascript" th:src="@{/js/tree/tree-unidadades-admin-1.js}"></script>
<script type="text/javascript" th:src="@{/js/tree/tree-unidadades-admin-2.js}"></script>
<script type="text/javascript" th:src="@{/js/tree/tree-unidadades-admin-3.js}"></script>

<script th:inline="javascript">
$(document).ready(function() {
    setTimeout(function() {
        const hayEnte = ($('#idEntePublicoSearch').val() !== '' && $('#idEntePublicoSearch').val() !== null)
                     || ($('#idEntePublicoSession').val() !== '' && $('#idEntePublicoSession').val() !== null);
        if (hayEnte) $('#btnExportarSistemas').prop('disabled', false);
    }, 500);

    $('#idEntePublicoSearch').on('change', function() {
        if ($(this).val() !== '' && $(this).val() !== null) {
            $('#btnExportarSistemas').prop('disabled', false);
        } else {
            $('#btnExportarSistemas').prop('disabled', true);
        }
    });
});

function exportarSistemasEnte() {
    const ctx = /*[[${contextSigtic}]]*/ '';

    const idEntePublico = parseInt($('#idEntePublicoSearch').val())
                       || parseInt($('#idEntePublicoSession').val())
                       || 0;
    const idUnidadAdministrativa = parseInt($('#idUnidadAdministrativaSearch').val()) || 0;
    const isAdministra           = $('#administra').is(':checked');
    const isOpera                = $('#opera').is(':checked');

    const url = ctx + '/api/catalogo/tic/exportarSistemas'
              + '?idEntePublico='          + idEntePublico
              + '&idUnidadAdministrativa=' + idUnidadAdministrativa
              + '&isAdministra='           + isAdministra
              + '&isOpera='               + isOpera;

    window.location.href = url;
}
</script>
</body>
</html>
