<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>



<th:block th:fragment="modalCorreo">

    <!--MODAL DE PRIMERA PANTALLA ENTE PUBLICO-->

    <div class="modal fade" id="dlgModalFormSearchCorreoElectronico" aria-labelledby="dlgModalFormCorreoElectronicoLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><span class="fw-bold">Buscar Usuario</span></h5>
                   <!-- <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>-->
                </div>

                <div class="modal-body body-modal">
                    <form id="formUsuarioSearch" role="form">
                        <div class="row g-2">
                            <div class="col-4">
                                <div class="form-floating mb-3">
                                    <input class="form-control form-control" type="text" id="rfcSearch" name="rfcSearch" minlength="4" maxlength="13" placeholder="RFC" onkeyup="mayus(this);">
                                    <label for="rfcSearch">RFC</label>
                                </div>
                            </div>

                            <div class="col-4">
                                <div class="form-floating mb-3">
                                    <input class="form-control form-control" type="text" id="nombreSearch" name="nombreSearch" minlength="3" placeholder="Nombre">
                                    <label for="nombreSearch">Nombre</label>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="form-floating mb-3">
                                    <input class="form-control form-control" type="text" id="segundoNombreSearch" name="segundoNombreSearch" minlength="3" placeholder="Segundo Nombre">
                                    <label for="segundoNombreSearch">Segundo Nombre</label>
                                </div>
                            </div>
                        </div>
                        <div class="row g-2">
                            <div class="col-4">
                                <div class="form-floating mb-3">
                                    <input class="form-control form-control" type="text" id="curpSearch" name="curpSearch" minlength="4" maxlength="18" placeholder="CURP" onkeyup="mayus(this);">
                                    <label for="curpSearch">CURP</label>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="form-floating mb-3">
                                    <input class="form-control form-control" type="text" id="apellitoPaternoSearch" name="apellitoPaternoSearch" minlength="3" placeholder="Apellido Paterno">
                                    <label for="apellitoPaternoSearch">Apellido Paterno</label>
                                </div>
                            </div>

                            <div class="col-4">
                                <div class="form-floating mb-3">
                                    <input class="form-control form-control" type="text" id="apellidoMaternoSearch" name="apellidoMaternoSearch" minlength="3" placeholder="Apellido Materno">
                                    <label for="apellidoMaternoSearch">Apellido Materno</label>
                                </div>
                            </div>
                        </div>


                        <div class="row mb-3">
                            <div class="col-md text-center">
                                <button class="btn btn-primary" type="submit" id="idBtnSearchTitular"><i class="bi bi-search"></i> Buscar Usuario</button>
                                <button class="btn btn-warning" type="button" id="idBtnSearchClean" onclick="limpiarFormularioSearch()"><i class="bi bi-eraser"></i> Limpiar</button>
                                <button class="btn btn-info" type="button" id="idBtnNewUser"><i class="bi bi-person-plus"></i> Nuevo Usuario</button>
                            </div>
                        </div>
                    </form>

                    <div class="card" style="display: none" id="idCardUsuSearch">
                        <div class="card-body">
                            <div class="d-flex align-items-center highlight-toolbar ps-3 pe-2 py- border-0 border-bottom">
                                <small class="card-title">Listado de Usuarios Encontrados</small>
                                <div class="d-flex ms-auto">

                                </div>
                            </div>
                            <table id="tableUsuarioSearch" class="table table-striped table-hover table-sm"  style="width:100%">
                                <thead>
                                <tr>
                                    <th>RFC</th>
                                    <th>CURP</th>
                                    <th>Nombre</th>
                                    <th>Estatus</th>
                                    <th>Acción</th>
                                </tr>
                                </thead>
                                <tbody>
                                </tbody>
                            </table>
                        </div>
                    </div>


                </div>
                <div class="modal-footer my-0">
                    <button type="button" class="btn btn-secondary btn-sm" id="btnCerrarSearch"><i class="bi bi-x-circle"></i> Cerrar</button>
                    <br/>
                </div>
            </div>
        </div>
    </div>


    <div class="modal fade" id="dlgModalFormCorreoElectronicoForm" aria-labelledby="dlgModalFormCorreoElectronicoFormLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><span id="titleFormCorreoElectronico" class="fw-bold"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>

                <div class="modal-body body-modal">
                    <form id="idFormCorreo" method="post">
                        <input type="hidden" id="idCorreoElectronico" name="idCorreoElectronico">
                        <div class="row g-2">
                            <div class="col">
                                <input type="hidden" id="idTitularCorreoElectronico" name="idTitularCorreoElectronico">
                                <label>Titular del Correo: </label> <span class="fw-bold" id="nombreTitularText"></span>
                            </div>
                        </div>
                        <br/>

                        <nav>
                            <div class="nav nav-tabs" id="nav-tab" role="tablist">
                                <button class="nav-link active" id="nav-data-bases-tab" data-bs-toggle="tab" data-bs-target="#nav-data-bases" type="button" role="tab" aria-controls="nav-data-bases" aria-selected="true">Datos Bases</button>
                                <button class="nav-link" id="nav-data-generalcorreo-tab" data-bs-toggle="tab" data-bs-target="#nav-data-generalcorreo" type="button" role="tab" aria-controls="nav-data-generalcorreo" aria-selected="false">Datos Generales</button>
                                <button class="nav-link" id="nav-data-correo-tab" data-bs-toggle="tab" data-bs-target="#nav-data-correo" type="button" role="tab" aria-controls="nav-data-correo" aria-selected="false">Datos Personales</button>
                                <button class="nav-link" id="nav-data-seguimiento-tab" data-bs-toggle="tab" data-bs-target="#nav-data-seguimiento" type="button" role="tab" aria-controls="nav-data-seguimiento" aria-selected="false">Seguimientos</button>
                            </div>
                        </nav>

                        <!-- EMPIEZA LAS PESTAÑAS -->

                        <div class="tab-content py-3" id="nav-tabContent">

                            <!--pestaña de DATOS BASES-->

                            <div class="tab-pane fade show active" id="nav-data-bases" role="tabpanel" aria-labelledby="nav-data-bases-tab" tabindex="0">

                                <div class="d-grid gap-2">
                                    <div class="row g-2">
                                        <div class="col-4">
                                            <div class="form-floating mb-3">
                                                <input type="text" class="form-control readOnly-x"  id="rfc" name="rfc" placeholder="RFC" readonly>
                                                <label for="rfc">RFC</label>
                                            </div>
                                        </div>
                                        <div class="col-4">
                                            <div class="form-floating mb-3">
                                                <input type="text" class="form-control readOnly-x"  id="curp" name="curp" placeholder="CURP" readonly>
                                                <label for="curp">CURP</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4"  id="sectionButtonAdd">
                                            <button class="btn btn-primary" type="button" id="idBtnSearchUser"><i class="bi bi-person-lines-fill"></i> Buscar Usuario</button>
                                            <button class="btn btn-primary" type="button" id="idBtnEditUser"><i class="bi bi-pencil"></i> Editar Usuario</button>
                                        </div>
                                    </div>
                                </div>

                                <div class="d-grid gap-2">
                                    <div class="row g-2">
                                        <div class="col-sm-12 col-md-6 col-xl-6 col-xxl-6">
                                            <div class="form-floating mb-3">
                                                <select class="form-select select2me" id="idServidorCorreoElectronico" name="idServidorCorreoElectronico">
                                                </select>
                                                <label for="idServidorCorreoElectronico"><span class="text-danger fw-bold">*</span> Servidor de Correo Electrónico</label>
                                            </div>
                                        </div>
                                        <div class="col-sm-12 col-md-6 col-xl-6 col-xxl-6">
                                            <div class="form-floating mb-3">
                                                <select class="form-select" id="tipoCorreo" name="tipoCorreo" aria-label="">
                                                </select>
                                                <label for="tipoCorreo"><span class="text-danger fw-bold">*</span> Tipo de Correo</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="d-grid gap-2">
                                    <div class="row g-2">
                                        <div class="col-sm-12 col-md-6 col-xl-6 col-xxl-6">
                                            <div class="form-floating mb-3">
                                                <select class="form-select" id="idEstatusCorreoElectronico" name="idEstatusCorreoElectronico">
                                                </select>
                                                <label for="idEstatusCorreoElectronico"><span class="text-danger fw-bold">*</span> Estatus de Correo Electrónico</label>
                                            </div>
                                        </div>
                                        <div class="col-sm-12 col-md-6 col-xl-6 col-xxl-6">
                                            <div class="form-floating mb-3">
                                                <select class="form-select" id="cveEstatus" name="cveEstatus" onchange="changeEstatus()">
                                                    <option value="VIG" selected>Vigente</option>
                                                    <option value="HIS">Historico</option>
                                                </select>
                                                <label for="cveEstatus"><span class="text-danger fw-bold">*</span> Estatus</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="d-grid gap-2">
                                    <div class="row g-2">
                                        <div class="col-md-4">
                                            <div class="form-floating mb-3">
                                                <input type="date" class="form-control"  id="fechaAltaCorreoElectronico" name="fechaAltaCorreoElectronico" placeholder="Fecha de Alta">
                                                <label for="fechaAltaCorreoElectronico"><span class="text-danger fw-bold">*</span> Fecha de Alta</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-floating mb-3">
                                                <input type="date" class="form-control"  id="fechaBajaCorreoElectronico" name="fechaBajaCorreoElectronico" placeholder="Fecha de Baja">
                                                <label for="fechaBajaCorreoElectronico"><span class="text-danger fw-bold">*</span> Fecha de Baja</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="mb-3 text-center bg-warning-light">
                                                <label>Fecha Último Cambio</label><br/><span class="fw-bold" id="fechaUltimoCambioText"></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>

                            <!--PESTAÑA DE DATOS GENERALES-->

                            <div class="tab-pane fade show" id="nav-data-generalcorreo" role="tabpanel" aria-labelledby="nav-data-generalcorreo-tab">

                                <div class="form-floating mb-3">
                                    <select class="form-select select2me" id="idEntePublico" name="idEntePublico">
                                    </select>
                                    <label for="idEntePublico"><span class="text-danger fw-bold">*</span> Ente Público</label>
                                </div>

                                <div class="input-group mb-3">
                                    <div class="form-floating py-1">
                                        <input type="hidden" id="idUnidadAdministrativa" name="idUnidadAdministrativa">
                                        <input type="text" class="form-control bg-secondary-subtle" id="descUnidadAdministrativa" name="descUnidadAdministrativa" readonly>
                                        <label for="descUnidadAdministrativa"><span class="text-danger fw-bold">*</span> Unidad Administrativa</label>
                                    </div>
                                    <button class="btn btn-primary" type="button" id="btnOpenArbol"><i class="bi bi-diagram-3"></i></button>
                                    <button class="btn btn-danger" type="button" id="btnLimpiarOpenArbol"><i class="bi bi-x-circle"></i></button>
                                </div>

                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control"  id="correoElectronico" name="correoElectronico" placeholder="Correo Electrónico" th:readonly="${rolEntePublico==1}">
                                    <label for="correoElectronico"><span class="text-danger fw-bold">*</span> Correo Electrónico</label>
                                </div>

                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control"  id="correoElectronicoEnvio" name="correoElectronicoEnvio" placeholder="Correo Electrónico Envío" th:readonly="${rolEntePublico==1}">
                                    <label for="correoElectronicoEnvio"><span class="text-danger fw-bold">*</span> Correo Electrónico Envio</label>
                                </div>

                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control"  id="correoElectronicoAlias" name="correoElectronicoAlias" placeholder="Correo Electrónico Alias" th:readonly="${rolEntePublico==1}">
                                    <label for="correoElectronicoEnvio"> Correo Electrónico Alias</label>
                                </div>

                                <div class="row g-2">
                                    <div class="col-md">
                                        <div class="form-floating mb-3">
                                            <input type="text" class="form-control"  id="puesto" name="puesto" placeholder="Cargo">
                                            <label for="puesto"><span class="text-danger fw-bold">*</span> Cargo</label>
                                        </div>
                                    </div>
                                    <div class="col-md">
                                        <div class="form-floating mb-3">
                                            <select class="form-select select2me" id="idCategoria" name="idCategoria" aria-label="">
                                            </select>
                                            <label for="idCategoria"><span class="text-danger fw-bold">*</span>Categoría</label>
                                        </div>
                                    </div>
                                </div>

                            </div>

                            <!--Datos Personales-->

                            <div class="tab-pane fade" id="nav-data-correo" role="tabpanel" aria-labelledby="nav-data-correo-tab">

                                <div class="d-grid gap-2">
                                    <div class="row g-2">
                                        <div class="col-sm-12 col-md-6 col-xl-6 col-xxl-6">
                                            <div class="form-floating mb-3">
                                                <input type="text" class="form-control"  id="correoPersonal" name="correoPersonal" placeholder="Correo Personal" disabled>
                                                <label for="correoPersonal">Correo Personal</label>
                                            </div>
                                        </div>
                                        <div class="col-sm-12 col-md-3 col-xl-3 col-xxl-3">
                                            <div class="form-floating mb-3">
                                                <input type="text" class="form-control"  id="telefonoPersonal" name="telefonoPersonal" placeholder="Teléfono Personal" disabled>
                                                <label for="telefonoPersonal">Teléfono Personal</label>
                                            </div>
                                        </div>
                                        <div class="col-sm-12 col-md-3 col-xl-3 col-xxl-3">
                                            <div class="form-floating mb-3">
                                                <input type="text" class="form-control"  id="celular" name="celular" placeholder="Celular" disabled>
                                                <label for="celular">Celular</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                               <br>
                            </div>
                        </div>

                            <div class="text-center" id="sectionButtonForm">
                                <button type="submit" i class="btn btn-primary btn-lg"><i class="fa-regular fa-floppy-disk"></i> Guardar</button>
                                <button type="button"  class="btn btn-danger btn-lg" onclick="limpiarFormCorreo()"><i class="fa fa-eraser"></i> Limpiar</button>
                                <div class="float-end"><span class="text-danger fw-bold">*</span> <span class="fw-bold">Campos requeridos</span></div>
                            </div>
                    </form>
                </div>
                <div class="modal-footer my-0">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cerrar</button>
                    <br/>
                </div>



            </div>
        </div>
    </div>

    <div class="modal fade" id="dlgModalCorreo" aria-labelledby="dlgModalCorreoArial" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"> <spa class="fw-bold text-primary" id="labelEntePublico"></spa><span id="idEntePublicoText" class="fw-bold"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>
                <div class="modal-body body-modal">
                    <div class="card">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-12">
                                    <small class="card-title">Unidad Administrativa: </small><span id="idUnidadAdminText"></span><br/>
                                    <small class="card-title">Tipo Correo: </small><span id="idTipoCorreoText"></span><br/>
                                </div>
                            </div>


                        </div>
                    </div>
                    <table id="tableCorreoModal" th:if="${activeConsultar}" class="table table-striped table-hover"  style="width:100%">
                        <thead>
                        <tr>
                            <th>CURP</th>
                            <th>Titular Correo</th>
                           <!-- <th>Tipo de Correo</th>-->
                            <th>Correo</th>
                            <th>Estatus Correo</th>
                            <th>Estatus Validación</th>
                        </tr>
                        </thead>
                    </table>

                </div>
                <div class="modal-footer my-0">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cerrar</button>
                    <br/>
                </div>

            </div>
        </div>
    </div>

</th:block>

</body>
</html>
