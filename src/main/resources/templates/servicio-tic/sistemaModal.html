<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<th:block th:fragment="modalSistema">

    <div class="modal fade" id="dlgModalFormSistema" aria-labelledby="dlgModalFormSistemaLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><span id="titleFormSistema" class="fw-bold"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>
                <div class="modal-body body-modal">
                    <form id="idFormSistema" method="post">
                        <input type="hidden" id="idSistema" name="idSistema">
                        <input type="hidden" class="form-control" name="opcion" id="opcion">
                        <nav>
                            <div class="nav nav-tabs" id="nav-tab" role="tablist">
                                <button class="nav-link active" id="nav-data-general-tab" data-bs-toggle="tab" data-bs-target="#nav-data-general" type="button" role="tab" aria-controls="nav-data-general" aria-selected="true">Datos Base</button>
                                <button class="nav-link" id="nav-data-asignado-tab" data-bs-toggle="tab" data-bs-target="#nav-data-asignado" type="button" role="tab" aria-controls="nav-data-asignado" aria-selected="false">Datos de Unidad Administrativa</button>
                                <button class="nav-link" id="nav-data-gittab" data-bs-toggle="tab" data-bs-target="#nav-data-git" type="button" role="tab" aria-controls="nav-data-git" aria-selected="false">Datos de GIT</button>
                            </div>
                        </nav>
                        <div class="tab-content py-3" id="nav-tabContent">
                            <div class="tab-pane fade show active" id="nav-data-general" role="tabpanel" aria-labelledby="nav-data-general-tab" tabindex="0">
                                <div class="d-grid gap-2">
                                    <div class="row g-2">
                                        <div class="col-4">
                                            <div class="form-floating">
                                                <select class="form-select" id="tipoSistema" name="tipoSistema" aria-label="">
                                                </select>
                                                <label for="tipoSistema"><span class="text-danger fw-bold">*</span> Tipo de Sistema</label>
                                            </div>
                                        </div>
                                        <div class="col-4">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="cveMejoraReg" name="cveMejoraReg" maxlength="8" placeholder="Código Mejora Regulatoria">
                                                <label for="cveMejoraReg"><!--<span class="text-danger fw-bold">*</span>--> Homoclave) Código de Mejora Regulatoria</label>
                                            </div>
                                        </div>
                                        <div class="col-4">
                                            <div class="form-floating">
                                                <input type="text" class="form-control" id="codigoSistema" name="codigoSistema" maxlength="8" placeholder="Código Sistema">
                                                <label for="codigoSistema"><span class="text-danger fw-bold">*</span> Código del Sistema</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-floating">
                                        <textarea class="form-control" placeholder="Definción del Tipo de Sistema" id="definicionTipoSistema"  name="definicionTipoSistema" style="height: 100px" disabled></textarea>
                                        <label for="definicionTipoSistema">Definción del Tipo de Sistema</label>
                                    </div>
                                    <div class="form-floating py-3" id="idDivSistemaPadre">
                                        <select class="form-select form-select-lg" id="idSistemaPadre" name="idSistemaPadre">
                                        </select>
                                        <label for="idSistemaPadre"><span class="text-danger fw-bold">*</span> Sistema Padre</label>
                                    </div>

                                    <div class="form-floating">
                                        <input type="text" class="form-control"  id="descSistemaAbrev" name="descSistemaAbrev" placeholder="Descripción del Sistema Abreviado" maxlength="100">
                                        <label for="descSistemaAbrev"><span class="text-danger fw-bold">*</span> Descripción del Sistema Abreviado</label>
                                    </div>

                                    <div class="form-floating">
                                        <input type="text" class="form-control"  id="descSistema" name="descSistema" placeholder="Descripción del Sistema" maxlength="100">
                                        <label for="descSistema"><span class="text-danger fw-bold">*</span> Descripción del Sistema</label>
                                    </div>

                                    <div class="form-floating">
                                        <textarea class="form-control" placeholder="Alcance del Sistema" id="alcanceSistema"  name="alcanceSistema" maxlength="4000" style="height: 100px"></textarea>
                                        <label for="alcanceSistema"><span class="text-danger fw-bold">*</span> Alcance del Sistema</label>
                                    </div>

                                    <div class="row g-2">
                                        <div class="col-md">
                                            <div class="form-floating">
                                                <input type="text" class="form-control"  id="numInventarioGet" name="numInventarioGet" placeholder="Número de Inventario de Patrimonio">
                                                <label for="numInventarioGet">Número de Inventario de Patrimonio</label>
                                            </div>
                                        </div>
                                        <div class="col-md">
                                            <div class="form-floating">
                                                <input type="text" class="form-control"  id="numInventarioEnte" name="numInventarioEnte" placeholder="Número de Inventario del Ente Público">
                                                <label for="numInventarioEnte">Número de Inventario del Ente Público</label>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row g-2">
                                        <div class="col-sm-12 col-md-6 col-xl-6 col-xxl-6">
                                            <div class="form-floating">
                                                <select class="form-select" id="estatusSistema" name="estatusSistema" aria-label="">
                                                </select>
                                                <label for="estatusSistema"><span class="text-danger fw-bold">*</span> Estatus Sistema</label>
                                            </div>
                                        </div>
                                        <div class="col-sm-12 col-md-3 col-xl-3 col-xxl-3">
                                            <div class="form-floating">
                                                <input type="number" class="form-control" id="orden" name="orden" placeholder="Número de Orden">
                                                <label for="orden"><span class="text-danger fw-bold">*</span> Número de Orden</label>
                                            </div>
                                        </div>
                                        <div class="col-sm-12 col-md-3 col-xl-3 col-xxl-3">
                                            <div class="form-floating">
                                                <select class="form-select" id="cveEstatus" name="cveEstatus">
                                                    <option value="VIG" selected>Vigente</option>
                                                    <option value="NOV">No vigente</option>
                                                    <option value="HIS">Historico</option>
                                                </select>
                                                <label for="cveEstatus"><span class="text-danger fw-bold">*</span> Estatus del Registro</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="tab-pane fade" id="nav-data-asignado" role="tabpanel" aria-labelledby="nav-data-asignado-tab" tabindex="0">
                                <div class="d-grid gap-2">
                                    <div class="cuadro-principal">
                                        <h2>Unidad Administrativa de Asistencia Técnica</h2>
                                        <div class="cuadro-secundario">
                                            <div class="form-floating py-3">
                                                <select class="form-select form-select-lg" id="idEntePublicoAdministra" name="idEntePublicoAdministra">
                                                </select>
                                                <label for="idEntePublicoAdministra">Ente Público</label>
                                            </div>

                                            <div class="row g-2">
                                                <div class="col-md">
                                                    <div class="input-group mb-3">
                                                        <div class="form-floating py-1">
                                                            <input type="hidden" id="idUnidadAdminAdministra" name="idUnidadAdminAdministra">
                                                            <input type="text" class="form-control bg-secondary-subtle" id="descUnidadAdminAdministra" name="descUnidadAdminAdministra" readonly>
                                                            <label for="descUnidadAdminAdministra"><span class="text-danger fw-bold">*</span> Unidad Administrativa</label>
                                                        </div>
                                                        <button class="btn btn-primary" type="button" id="idBtnUnidadAdmin"><i class="bi bi-diagram-3"></i></button>

                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="cuadro-principal">
                                        <h2>Unidad Administrativa que Opera</h2>
                                        <div class="cuadro-secundario">

                                            <div class="form-floating py-3">
                                                <select class="form-select form-select-lg" id="idEntePublicoOpera" name="idEntePublicoOpera">
                                                </select>
                                                <label for="idEntePublicoOpera">Ente Público</label>
                                            </div>
                                            <div class="row g-2">
                                                <div class="col-md">
                                                    <div class="input-group mb-3">
                                                        <div class="form-floating py-1">
                                                            <input type="hidden" id="idUnidadAdminOpera" name="idUnidadAdminOpera">
                                                            <input type="text" class="form-control bg-secondary-subtle" id="descUnidadAdminOpera" name="descUnidadAdminOpera" readonly>
                                                            <label for="descUnidadAdminOpera">Unidad Administrativa</label>
                                                        </div>
                                                        <button class="btn btn-primary" type="button" id="idBtnUnidadOperativa"><i class="bi bi-diagram-3"></i></button>

                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>


                                </div>

                            </div>
                            <div class="tab-pane fade" id="nav-data-git" role="tabpanel" aria-labelledby="nav-data-git-tab" tabindex="0">
                                <div class="d-grid gap-2" id="divSistemaGit">
                                    <div class="row g-2">
                                        <div class="col-4">
                                            <div class="form-floating">
                                                <input type="hidden" id="idSistemaGit" name="idSistemaGit">
                                                <input type="text" class="form-control" id="codigoGit" name="codigoGit" placeholder="Código Git">
                                                <label for="codigoGit"><span class="text-danger fw-bold">*</span>Código GIT</label>
                                            </div>
                                        </div>
                                        <div class="col-4">
                                            <div class="form-floating">
                                                <textarea class="form-control" placeholder="Descripción Git" id="descripcionGit"  name="descripcionGit" style="height: 100px"></textarea>
                                                <label for="descripcionGit">Descripción Git</label>

                                            </div>
                                        </div>
                                        <div class="col-4">
                                            <button type="button" id="idBtnGit" onclick="agregarGit()" class="btn btn-primary btn-lg"><i class="fa fa-plus-circle"></i> Agregar</button>
                                        </div>
                                    </div>

                                </div>
                                <br/>
                                <table id="tableSistemaGit" th:if="${activeConsultar}" class="table table-striped table-hover table-sm"  style="width:100%">
                                    <thead>
                                    <tr>
                                        <th>Código Git</th>
                                        <th>Descripción</th>
                                        <th>Acción</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    </tbody>
                                </table>



                            </div>

                        </div>

                        <div class="text-center">
                            <button type="submit"  class="btn btn-primary btn-lg"><i class="fa-regular fa-floppy-disk"></i> Guardar</button>
                            <div class="float-end"><span class="text-danger fw-bold">*</span> <span class="fw-bold">Campos requeridos</span></div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer my-0">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cerrar</button>
                    <br/>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="dlgModalSistemasHijo" aria-labelledby="dlgModalSistemasHijoLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"> <spa class="fw-bold text-primary">Sistema Padre : </spa><span id="titleSistemaHijo" class="fw-bold"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>
                <div class="modal-body body-modal">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex align-items-center highlight-toolbar ps-3 pe-2 py-1 border-0 border-top border-bottom">
                                <small class="card-title">Listado de Sistemas Hijos</small>
                            </div>

                            <table id="tableSistemaHijo" class="table table-striped table-hover table-sm"  style="width:100%">
                                <thead>
                                <tr>
                                    <th>Código Sistema</th>
                                    <th>Descripción del Sistema</th>
                                    <th>Tipo de Sistema</th>
                                    <th>Ente Público Administra</th>
                                    <th>Unidad Admin Administra</th>
                                    <th>Estatus</th>
                                </tr>
                                </thead>
                                <tbody>
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
                <div class="modal-footer my-0">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cerrar</button>
                    <br/>
                </div>

            </div>
        </div>
    </div>
</th:block>
</body>
</html>
